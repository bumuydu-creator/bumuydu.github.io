  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // ==========================================
    // 1. PROCEDURAL SOUND SYNTHESIZER (WEB AUDIO)
    // ==========================================
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx && typeof window !== 'undefined') {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume().catch(() => {});
        }
      }
      playSlash() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(420, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }
      playSpell() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.25);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.25);
        } catch(e) {}
      }
      playHit() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(160, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
          gain.gain.setValueAtTime(0.35, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.1);
        } catch(e) {}
      }
      playMonsterHit() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(220, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(70, this.ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.08);
        } catch(e) {}
      }
      playMonsterDeath() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(35, this.ctx.currentTime + 0.22);
          gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.22);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.22);
        } catch(e) {}
      }
      playPickup() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(520, this.ctx.currentTime);
          osc.frequency.setValueAtTime(780, this.ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        } catch(e) {}
      }
      playJump() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(180, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(360, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.12);
        } catch(e) {}
      }
      playExplosion() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(120, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
          gain.gain.setValueAtTime(0.45, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.4);
        } catch(e) {}
      }
      playShieldBlock() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'square';
          osc.frequency.setValueAtTime(440, this.ctx.currentTime);
          osc.frequency.setValueAtTime(220, this.ctx.currentTime + 0.05);
          gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.15);
          osc.connect(gain); gain.connect(this.ctx.destination);
          osc.start(); osc.stop(this.ctx.currentTime + 0.15);
        } catch(e) {}
      }
      playVictory() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        try {
          const notes = [261.63, 329.63, 392.0, 523.25];
          notes.forEach((freq, idx) => {
            const osc = this.ctx.createOscillator();
            const gain = this.ctx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, this.ctx.currentTime + idx * 0.1);
            gain.gain.setValueAtTime(0.2, this.ctx.currentTime + idx * 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + idx * 0.1 + 0.25);
            osc.connect(gain); gain.connect(this.ctx.destination);
            osc.start(this.ctx.currentTime + idx * 0.1);
            osc.stop(this.ctx.currentTime + idx * 0.1 + 0.25);
          });
        } catch(e) {}
      }
    }
    const sound = new SoundEngine();

    // ==========================================
    // 2. MONSTER PIXEL ART PROCEDURAL RENDERERS
    // ==========================================
    function drawSkeleton(ctx, px, py, width, height, facing, frame, state, isHit, isBoss = false) {
      const dir = facing === 'right' ? 1 : -1;
      const originX = px + width / 2;
      const scale = isBoss ? 1.6 : 1.0;

      ctx.save();
      ctx.translate(originX, py + height);
      ctx.scale(dir * scale, scale);
      if (isHit) ctx.filter = 'brightness(2.2) contrast(1.5)';

      const boneColor = isBoss ? '#e2d9c8' : '#d5cebe';
      const boneShadow = isBoss ? '#8a7e6b' : '#9c9281';
      const brownLeather = '#784d28';
      const ironColor = isBoss ? '#f59e0b' : '#94a3b8';
      const eyeGlow = isBoss ? '#ef4444' : '#60a5fa';

      if (state === 'death') {
        const progress = Math.min(1, frame / 5);
        ctx.fillStyle = boneColor;
        ctx.beginPath(); ctx.ellipse(0, -6, 18, 6, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = ironColor;
        ctx.beginPath(); ctx.ellipse(dir * 12, -4, 10, 4, 0.3, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      let bounceY = 0; let legOffset = 0; let swordAngle = 0;
      let swordX = 14; let swordY = -24; let shieldX = -12; let shieldY = -24;

      if (state === 'idle') {
        bounceY = Math.sin(frame * 0.8) * 1.5;
      } else if (state === 'walk') {
        bounceY = Math.abs(Math.sin(frame * 1.2)) * 3;
        legOffset = Math.sin(frame * 1.2) * 6;
        swordAngle = Math.sin(frame * 1.2) * 0.2;
      } else if (state === 'attack') {
        const p = (frame % 4) / 4;
        if (p < 0.3) { swordAngle = -0.7; swordX = 8; swordY = -34; }
        else if (p < 0.7) {
          swordAngle = 1.2; swordX = 26; swordY = -18;
          ctx.strokeStyle = 'rgba(255, 255, 255, 0.7)'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.arc(8, -26, 26, -0.4, 0.9); ctx.stroke();
        } else { swordAngle = 0.3; swordX = 20; swordY = -22; }
      } else if (state === 'special') {
        shieldX = 8; shieldY = -26; swordX = -4; swordY = -22; swordAngle = -0.5;
      } else if (state === 'hit') {
        bounceY = -4; swordAngle = -0.8;
      }

      const baseY = -height + 12 + bounceY;

      // Legs
      ctx.fillStyle = boneShadow; ctx.fillRect(-6 - legOffset, -16, 4, 16);
      ctx.fillStyle = brownLeather; ctx.fillRect(-7 - legOffset, -6, 6, 6);
      ctx.fillStyle = boneColor; ctx.fillRect(2 + legOffset, -16, 4, 16);
      ctx.fillStyle = brownLeather; ctx.fillRect(1 + legOffset, -6, 6, 6);

      // Spine & Ribs
      ctx.fillStyle = boneColor; ctx.fillRect(-2, baseY + 18, 4, 14);
      ctx.fillRect(-6, baseY + 19, 12, 2);
      ctx.fillRect(-7, baseY + 23, 14, 2);
      ctx.fillRect(-6, baseY + 27, 12, 2);

      // Loincloth
      ctx.fillStyle = brownLeather;
      ctx.beginPath(); ctx.moveTo(-7, baseY + 30); ctx.lineTo(7, baseY + 30);
      ctx.lineTo(4, baseY + 38); ctx.lineTo(-4, baseY + 38); ctx.closePath(); ctx.fill();

      // Skull
      ctx.fillStyle = boneColor;
      ctx.beginPath(); ctx.arc(0, baseY + 10, 8, 0, Math.PI * 2); ctx.fill();

      // Helmet / Crown
      ctx.fillStyle = ironColor;
      ctx.beginPath(); ctx.arc(0, baseY + 8, 8.5, Math.PI * 1.0, Math.PI * 2.0); ctx.fill();
      if (isBoss) {
        ctx.fillRect(-6, baseY - 2, 3, 5); ctx.fillRect(-1, baseY - 4, 3, 7); ctx.fillRect(4, baseY - 2, 3, 5);
      }

      // Eyes
      ctx.fillStyle = '#1e293b'; ctx.fillRect(1, baseY + 9, 3, 3); ctx.fillRect(-5, baseY + 9, 3, 3);
      ctx.fillStyle = eyeGlow; ctx.fillRect(2, baseY + 10, 2, 2); ctx.fillRect(-4, baseY + 10, 2, 2);

      // Shield
      ctx.save(); ctx.translate(shieldX, baseY + 24);
      ctx.fillStyle = ironColor; ctx.beginPath(); ctx.arc(0, 0, 11, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = isBoss ? '#991b1b' : '#334155'; ctx.beginPath(); ctx.arc(0, 0, 8, 0, Math.PI * 2); ctx.fill();
      ctx.restore();

      // Sword
      ctx.save(); ctx.translate(swordX, baseY + 20); ctx.rotate(swordAngle);
      ctx.fillStyle = boneColor; ctx.fillRect(-10, -2, 10, 3);
      ctx.fillStyle = '#92400e'; ctx.fillRect(-2, -4, 4, 3);
      ctx.fillStyle = ironColor; ctx.fillRect(-5, -6, 10, 3);
      const bladeLen = isBoss ? 36 : 24;
      ctx.fillStyle = '#f1f5f9'; ctx.beginPath(); ctx.moveTo(-2, -6); ctx.lineTo(2, -6); ctx.lineTo(0, -6 - bladeLen); ctx.closePath(); ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    function drawGoblin(ctx, px, py, width, height, facing, frame, state, isHit, isBoss = false) {
      const dir = facing === 'right' ? 1 : -1;
      const originX = px + width / 2;
      const scale = isBoss ? 1.5 : 1.0;

      ctx.save();
      ctx.translate(originX, py + height);
      ctx.scale(dir * scale, scale);
      if (isHit) ctx.filter = 'brightness(2.2) contrast(1.5)';

      const greenSkin = isBoss ? '#15803d' : '#22c55e';
      const darkSkin = '#166534';
      const vestColor = isBoss ? '#b91c1c' : '#9a3412';
      const pantsColor = '#334155';
      const eyeColor = '#facc15';
      const daggerSteel = '#e2e8f0';

      if (state === 'death') {
        ctx.fillStyle = greenSkin;
        ctx.beginPath(); ctx.ellipse(dir * 6, -6, 16, 7, 0.1, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      let bounceY = 0; let legSwing = 0; let daggerAngle = 0;
      let daggerX = 14; let daggerY = -18;

      if (state === 'idle') {
        bounceY = Math.sin(frame * 0.7) * 1.5;
      } else if (state === 'walk') {
        bounceY = Math.abs(Math.sin(frame * 1.4)) * 3.5;
        legSwing = Math.sin(frame * 1.4) * 8;
        daggerAngle = Math.sin(frame * 1.4) * 0.3;
      } else if (state === 'attack') {
        const p = (frame % 4) / 4;
        if (p < 0.3) { daggerAngle = -0.9; daggerX = 4; daggerY = -24; }
        else {
          daggerAngle = 1.3; daggerX = 24; daggerY = -14;
          ctx.strokeStyle = 'rgba(250, 204, 21, 0.8)'; ctx.lineWidth = 2;
          ctx.beginPath(); ctx.moveTo(10, -18); ctx.lineTo(34, -14); ctx.stroke();
        }
      } else if (state === 'hit') {
        bounceY = -5; daggerAngle = -0.8;
      }

      const baseY = -height + 10 + bounceY;

      // Legs
      ctx.fillStyle = pantsColor; ctx.fillRect(-8 - legSwing * 0.6, -14, 5, 14); ctx.fillRect(3 + legSwing * 0.6, -14, 5, 14);
      ctx.fillStyle = '#78350f'; ctx.fillRect(-9 - legSwing * 0.6, -4, 7, 4); ctx.fillRect(2 + legSwing * 0.6, -4, 7, 4);

      // Torso / Vest
      ctx.fillStyle = vestColor; ctx.fillRect(-7, baseY + 18, 14, 13);
      ctx.fillStyle = '#451a03'; ctx.fillRect(-8, baseY + 28, 16, 3);
      ctx.fillStyle = '#f59e0b'; ctx.fillRect(-2, baseY + 28, 4, 3);

      // Ears
      ctx.fillStyle = greenSkin;
      ctx.beginPath(); ctx.moveTo(-6, baseY + 10); ctx.lineTo(-18, baseY + 4); ctx.lineTo(-6, baseY + 14); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(6, baseY + 10); ctx.lineTo(16, baseY + 2); ctx.lineTo(6, baseY + 14); ctx.closePath(); ctx.fill();

      // Head
      ctx.beginPath(); ctx.ellipse(0, baseY + 10, 8, 7, 0, 0, Math.PI * 2); ctx.fill();

      // Nose & Eyes
      ctx.fillStyle = darkSkin; ctx.beginPath(); ctx.moveTo(4, baseY + 9); ctx.lineTo(11, baseY + 12); ctx.lineTo(4, baseY + 14); ctx.closePath(); ctx.fill();
      ctx.fillStyle = eyeColor;
      ctx.beginPath(); ctx.ellipse(3, baseY + 8, 2.5, 2.5, 0, 0, Math.PI * 2); ctx.ellipse(-3, baseY + 8, 2.5, 2.5, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#000000'; ctx.fillRect(3, baseY + 7, 1, 3); ctx.fillRect(-3, baseY + 7, 1, 3);

      // Dagger
      ctx.save(); ctx.translate(daggerX, baseY + 22); ctx.rotate(daggerAngle);
      ctx.fillStyle = greenSkin; ctx.fillRect(-8, -2, 8, 4);
      ctx.fillStyle = '#ca8a04'; ctx.fillRect(-1, -5, 2, 10);
      ctx.fillStyle = daggerSteel;
      ctx.beginPath(); ctx.moveTo(1, -2); ctx.lineTo(16, -4); ctx.quadraticCurveTo(18, 0, 14, 2); ctx.lineTo(1, 2); ctx.closePath(); ctx.fill();
      ctx.restore();

      ctx.restore();
    }

    function drawMushroom(ctx, px, py, width, height, facing, frame, state, isHit, isBoss = false) {
      const dir = facing === 'right' ? 1 : -1;
      const originX = px + width / 2;
      const scale = isBoss ? 1.7 : 1.0;

      ctx.save();
      ctx.translate(originX, py + height);
      ctx.scale(dir * scale, scale);
      if (isHit) ctx.filter = 'brightness(2.2) contrast(1.5)';

      const capColor = isBoss ? '#831843' : '#881337';
      const capUnderside = isBoss ? '#be185d' : '#4c0519';
      const bodyColor = '#f3f4f6';
      const bodyShadow = '#d1d5db';
      const eyeGlow = '#ef4444';

      if (state === 'death') {
        ctx.fillStyle = capColor;
        ctx.beginPath(); ctx.ellipse(0, -4, 18, 5, 0, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      let capSquash = 1; let bounceY = 0; let waddleX = 0; let armReach = 0;

      if (state === 'idle') {
        capSquash = 1 + Math.sin(frame * 0.6) * 0.08;
        bounceY = Math.sin(frame * 0.6) * 1.5;
      } else if (state === 'walk') {
        bounceY = Math.abs(Math.sin(frame * 1.1)) * 3;
        waddleX = Math.sin(frame * 1.1) * 3;
      } else if (state === 'attack') {
        const p = (frame % 4) / 4;
        armReach = p > 0.3 ? 14 : 4;
        capSquash = 0.9;
        if (p > 0.4 && p < 0.8) {
          ctx.fillStyle = 'rgba(239, 68, 68, 0.6)';
          ctx.beginPath(); ctx.arc(22, -26, 12, 0, Math.PI * 2); ctx.arc(32, -20, 8, 0, Math.PI * 2); ctx.fill();
        }
      } else if (state === 'hit') {
        bounceY = -4; capSquash = 0.8;
      }

      const baseY = -height + 8 + bounceY;

      // Feet
      ctx.fillStyle = bodyShadow;
      ctx.beginPath(); ctx.ellipse(-7 + waddleX, -4, 6, 4, 0, 0, Math.PI * 2); ctx.ellipse(7 - waddleX, -4, 6, 4, 0, 0, Math.PI * 2); ctx.fill();

      // Body
      ctx.fillStyle = bodyColor;
      ctx.beginPath(); ctx.ellipse(0, baseY + 26, 14, 15, 0, 0, Math.PI * 2); ctx.fill();

      // Arms
      ctx.fillStyle = '#475569';
      ctx.fillRect(-12, baseY + 24, 4, 8); ctx.fillRect(8 + armReach, baseY + 24, 4 + armReach, 8);

      // Red Eyes & Teeth
      ctx.fillStyle = eyeGlow; ctx.fillRect(-6, baseY + 20, 3, 3); ctx.fillRect(3, baseY + 20, 3, 3);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(-7, baseY + 26, 14, 5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-6, baseY + 26, 2, 2); ctx.fillRect(2, baseY + 26, 2, 2);

      // Mushroom Cap Gills & Top
      ctx.fillStyle = capUnderside;
      ctx.beginPath(); ctx.ellipse(0, baseY + 12, 19, 5 * capSquash, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = capColor;
      ctx.beginPath(); ctx.ellipse(0, baseY + 8, 21, 13 * capSquash, 0, Math.PI, Math.PI * 2); ctx.fill();

      // Spots
      ctx.fillStyle = isBoss ? '#fbbf24' : '#fecdd3';
      ctx.beginPath(); ctx.arc(-10, baseY + 4, 3, 0, Math.PI * 2); ctx.arc(0, baseY + 1, 4, 0, Math.PI * 2); ctx.arc(11, baseY + 5, 3, 0, Math.PI * 2); ctx.fill();

      ctx.restore();
    }

    function drawFlyingEye(ctx, px, py, width, height, facing, frame, state, isHit, isBoss = false) {
      const dir = facing === 'right' ? 1 : -1;
      const originX = px + width / 2;
      const scale = isBoss ? 1.6 : 1.0;

      ctx.save();
      ctx.translate(originX, py + height / 2);
      ctx.scale(dir * scale, scale);
      if (isHit) ctx.filter = 'brightness(2.2) contrast(1.5)';

      const skinColor = isBoss ? '#581c87' : '#713f12';
      const skinDark = isBoss ? '#3b0764' : '#451a03';
      const eyeWhite = '#f8fafc';
      const eyePupil = isBoss ? '#ec4899' : '#dc2626';

      if (state === 'death') {
        ctx.fillStyle = skinColor;
        ctx.beginPath(); ctx.ellipse(0, 10, 10, 14, 0.4, 0, Math.PI * 2); ctx.fill();
        ctx.restore();
        return;
      }

      const flapSpeed = state === 'attack' ? 1.8 : 1.0;
      const wingFlap = Math.sin(frame * flapSpeed);
      const hoverY = Math.cos(frame * 0.6) * 4;
      ctx.translate(0, hoverY);

      // Wings
      ctx.fillStyle = skinDark;
      ctx.beginPath(); ctx.moveTo(-8, -4); ctx.quadraticCurveTo(-22, -18 * wingFlap, -32, -6 * wingFlap); ctx.quadraticCurveTo(-24, 8 * wingFlap, -10, 6); ctx.closePath(); ctx.fill();
      ctx.fillStyle = skinColor;
      ctx.beginPath(); ctx.moveTo(8, -4); ctx.quadraticCurveTo(22, -22 * wingFlap, 34, -8 * wingFlap); ctx.quadraticCurveTo(24, 10 * wingFlap, 10, 6); ctx.closePath(); ctx.fill();

      // Main Eye Body
      ctx.fillStyle = skinColor;
      ctx.beginPath(); ctx.arc(0, 0, 14, 0, Math.PI * 2); ctx.fill();

      // Giant Eye
      ctx.fillStyle = eyeWhite; ctx.beginPath(); ctx.arc(2, -1, 9, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = eyePupil; ctx.beginPath(); ctx.arc(3, -1, 5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.fillRect(3, -3, 2, 5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(2, -3, 2, 2);

      // Fangs
      ctx.fillStyle = '#0f172a'; ctx.beginPath(); ctx.ellipse(1, 9, 8, 4, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#ffffff'; ctx.fillRect(-4, 7, 2, 3); ctx.fillRect(0, 7, 2, 3); ctx.fillRect(4, 7, 2, 3);

      if (state === 'attack') {
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.7)'; ctx.lineWidth = isBoss ? 6 : 3;
        ctx.beginPath(); ctx.moveTo(4, -1); ctx.lineTo(40, -1); ctx.stroke();
      }

      ctx.restore();
    }

    function drawEnemyMonster(ctx, type, px, py, width, height, facing, frame, state, isHit) {
      switch (type) {
        case 'skeleton': drawSkeleton(ctx, px, py, width, height, facing, frame, state, isHit, false); break;
        case 'boss_skeleton': drawSkeleton(ctx, px, py, width, height, facing, frame, state, isHit, true); break;
        case 'goblin': drawGoblin(ctx, px, py, width, height, facing, frame, state, isHit, false); break;
        case 'boss_goblin': drawGoblin(ctx, px, py, width, height, facing, frame, state, isHit, true); break;
        case 'mushroom': drawMushroom(ctx, px, py, width, height, facing, frame, state, isHit, false); break;
        case 'boss_mushroom': drawMushroom(ctx, px, py, width, height, facing, frame, state, isHit, true); break;
        case 'flying_eye': drawFlyingEye(ctx, px, py, width, height, facing, frame, state, isHit, false); break;
        case 'boss_eye': drawFlyingEye(ctx, px, py, width, height, facing, frame, state, isHit, true); break;
        default: drawSkeleton(ctx, px, py, width, height, facing, frame, state, isHit, false); break;
      }
    }

    // ==========================================
    // 3. HERO PROCEDURAL SPRITE RENDERER (WARRIOR SPRITESHEET)
    // ==========================================
    function drawHeroSprite(ctx, px, py, width, height, facing, color, secondaryColor, role, isAttacking, isDashing, currentAnim, animFrame, invulnTimer) {
      const dir = facing === 'right' ? 1 : -1;
      const originX = px + width / 2;

      ctx.save();
      ctx.translate(originX, py + height);
      ctx.scale(dir, 1);

      if (invulnTimer > 0 && Math.floor(animFrame / 2) % 2 === 0) {
        ctx.globalAlpha = 0.5;
      }

      // Exact Color Palette from the Warrior Spritesheet:
      const skinColor = '#f5c39e';
      const skinShadow = '#d49b78';
      const hairColor = '#0f172a';
      const beardColor = '#0b0f19';
      const cowlBrown = '#78350f'; // Warm brown mantle
      const cowlShadow = '#592209';
      const cowlGoldTrim = '#f59e0b'; // Amber-gold cowl border
      const tunicDark = '#1e2530'; // Dark charcoal sleeveless tunic
      const tunicLight = '#2b3442';
      const beltLeather = '#451a03';
      const beltBuckle = '#cbd5e1';
      const bracerDark = '#181e29';
      const pantsBrown = '#5c3826';
      const pantsShadow = '#422416';
      const bootsBlack = '#0f172a';
      const steelBlade = '#f1f5f9';
      const steelShadow = '#94a3b8';
      const steelHilt = '#cbd5e1';

      if (currentAnim === 'death') {
        const f = Math.min(9, animFrame % 10);
        const collapseRatio = f / 9;

        // Dropped Sword on ground
        ctx.save();
        ctx.translate(dir * (12 + f * 2), -2);
        ctx.rotate(0.3 + f * 0.05);
        ctx.fillStyle = steelHilt; ctx.fillRect(-2, -2, 4, 3);
        ctx.fillStyle = bracerDark; ctx.fillRect(-1, 0, 2, 5);
        ctx.fillStyle = steelBlade;
        ctx.beginPath(); ctx.moveTo(-2, -2); ctx.lineTo(2, -2); ctx.lineTo(1, -26); ctx.lineTo(-1, -26); ctx.closePath(); ctx.fill();
        ctx.restore();

        // Body collapsing
        ctx.save();
        const fallY = -12 + collapseRatio * 8;
        const bodyTilt = collapseRatio * 1.3;
        ctx.translate(dir * (collapseRatio * 10), fallY);
        ctx.rotate(bodyTilt);

        ctx.fillStyle = pantsBrown; ctx.fillRect(-8, -12, 7, 12); ctx.fillRect(2, -12, 7, 12);
        ctx.fillStyle = bootsBlack; ctx.fillRect(-9, -4, 8, 5); ctx.fillRect(1, -4, 8, 5);
        ctx.fillStyle = tunicDark; ctx.fillRect(-9, -24, 18, 14);
        ctx.fillStyle = cowlBrown; ctx.fillRect(-10, -28, 20, 8);
        ctx.fillStyle = cowlGoldTrim; ctx.fillRect(-10, -21, 20, 2);
        ctx.fillStyle = skinColor; ctx.fillRect(-4, -36, 10, 9);
        ctx.fillStyle = hairColor; ctx.fillRect(-6, -39, 13, 5);
        ctx.fillStyle = beardColor; ctx.fillRect(-3, -31, 8, 5);

        ctx.restore();
        ctx.restore();
        return;
      }

      let bodyY = -48;
      let bodyTilt = 0;
      let legLeftOffset = 0;
      let legRightOffset = 0;
      let legLeftLift = 0;
      let legRightLift = 0;
      let swordAngle = 0.2;
      let swordX = 14;
      let swordY = -18;
      let swordLength = 28;
      let showSlashArc = false;

      if (currentAnim === 'idle') {
        const idleCycle = (animFrame % 6) / 6;
        const breath = Math.sin(idleCycle * Math.PI * 2) * 1.5;
        bodyY = -48 + breath;
        swordAngle = 0.3 + Math.sin(idleCycle * Math.PI * 2) * 0.05;
        swordX = 12;
        swordY = -20 + breath;
      } else if (currentAnim === 'run') {
        const runCycle = (animFrame % 8);
        bodyTilt = 0.16;
        const runBounce = Math.abs(Math.sin((runCycle / 8) * Math.PI * 2)) * 3.5;
        bodyY = -48 + runBounce;

        const stride = Math.sin((runCycle / 8) * Math.PI * 2) * 12;
        legLeftOffset = -stride;
        legRightOffset = stride;
        legLeftLift = stride < 0 ? Math.abs(stride) * 0.7 : 0;
        legRightLift = stride > 0 ? stride * 0.7 : 0;

        swordAngle = -0.4 + Math.sin((runCycle / 8) * Math.PI * 2) * 0.2;
        swordX = 10;
        swordY = -24 + runBounce;
      } else if (currentAnim === 'jump') {
        bodyY = -52; bodyTilt = 0.1;
        legLeftOffset = -4; legRightOffset = 4;
        legLeftLift = 7; legRightLift = 5;
        swordAngle = 0.65; swordX = 16; swordY = -20;
      } else if (currentAnim === 'fall') {
        bodyY = -47;
        legLeftOffset = -3; legRightOffset = 3;
        legLeftLift = 3; legRightLift = 2;
        swordAngle = -0.05; swordX = 11; swordY = -22;
      } else if (currentAnim === 'attack' || isAttacking) {
        const f = animFrame % 4;
        if (f === 0) {
          bodyTilt = -0.08; bodyY = -49; swordAngle = -1.1; swordX = -2; swordY = -36;
        } else if (f === 1) {
          bodyTilt = 0.18; bodyY = -46; swordAngle = -0.2; swordX = 14; swordY = -30;
          showSlashArc = true;
        } else if (f === 2) {
          bodyTilt = 0.26; bodyY = -44; swordAngle = 1.25; swordX = 26; swordY = -14;
          swordLength = 32; showSlashArc = true;
        } else {
          bodyTilt = 0.12; bodyY = -46; swordAngle = 0.8; swordX = 20; swordY = -18;
        }
      } else if (currentAnim === 'hit') {
        bodyTilt = -0.25; bodyY = -50; legLeftOffset = -6; legRightOffset = 2;
        swordAngle = -0.7; swordX = 6; swordY = -28;
      }

      // 1. Legs & Boots
      ctx.save();
      ctx.fillStyle = pantsShadow;
      ctx.fillRect(-8 + legLeftOffset, -18 + legLeftLift, 6, 12 - legLeftLift);
      ctx.fillStyle = bootsBlack;
      ctx.fillRect(-9 + legLeftOffset, -6 + legLeftLift, 8, 7 - legLeftLift);
      ctx.restore();

      ctx.save();
      ctx.fillStyle = pantsBrown;
      ctx.fillRect(2 + legRightOffset, -18 + legRightLift, 6, 12 - legRightLift);
      ctx.fillStyle = bootsBlack;
      ctx.fillRect(1 + legRightOffset, -6 + legRightLift, 8, 7 - legRightLift);
      ctx.restore();

      // 2. Torso, Belt & Tunic
      ctx.save();
      ctx.translate(0, bodyY + 36);
      ctx.rotate(bodyTilt);

      ctx.fillStyle = tunicDark;
      ctx.beginPath();
      ctx.moveTo(-9, -4); ctx.lineTo(9, -4); ctx.lineTo(10, 8); ctx.lineTo(-10, 8);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = beltLeather; ctx.fillRect(-9, -4, 18, 4);
      ctx.fillStyle = beltBuckle; ctx.fillRect(-2, -4, 4, 4);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(-1, -3, 2, 2);

      ctx.fillStyle = tunicDark; ctx.fillRect(-8, -19, 16, 15);
      ctx.fillStyle = tunicLight; ctx.fillRect(-6, -19, 3, 14);

      // 3. Bare Arms & Wrist Bracers
      ctx.fillStyle = skinShadow; ctx.fillRect(-11, -17, 4, 10);
      ctx.fillStyle = bracerDark; ctx.fillRect(-12, -10, 5, 5);
      ctx.fillStyle = skinColor; ctx.fillRect(7, -17, 4, 10);
      ctx.fillStyle = bracerDark; ctx.fillRect(7, -10, 5, 5);

      // 4. Brown Cowl with Gold Trim
      ctx.fillStyle = cowlBrown;
      ctx.beginPath();
      ctx.moveTo(-11, -19); ctx.lineTo(11, -19); ctx.lineTo(12, -10); ctx.lineTo(-12, -10);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = cowlShadow; ctx.fillRect(-8, -19, 16, 3);
      ctx.fillStyle = cowlGoldTrim; ctx.fillRect(-12, -10, 24, 2.5);

      // 5. Head, Hair & Beard
      ctx.fillStyle = skinColor; ctx.fillRect(-2, -22, 5, 4);
      ctx.beginPath(); ctx.arc(1, -27, 7.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = beardColor;
      ctx.beginPath();
      ctx.moveTo(-3, -27); ctx.lineTo(8, -27); ctx.lineTo(7, -20); ctx.lineTo(-2, -20);
      ctx.closePath(); ctx.fill();
      ctx.fillRect(1, -19, 5, 2);

      ctx.fillStyle = skinColor; ctx.fillRect(1, -29, 6, 4);
      ctx.fillStyle = hairColor; ctx.fillRect(2, -30, 4, 1.5);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(4, -28, 2, 2.5);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(3, -28, 1, 1.5);

      ctx.fillStyle = hairColor;
      ctx.beginPath(); ctx.arc(0, -31, 7.8, Math.PI * 0.85, Math.PI * 2.15); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-6, -34); ctx.lineTo(-2, -39); ctx.lineTo(2, -34); ctx.fill();
      ctx.beginPath(); ctx.moveTo(1, -34); ctx.lineTo(5, -38); ctx.lineTo(8, -32); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-7, -29); ctx.lineTo(-10, -32); ctx.lineTo(-6, -35); ctx.fill();

      ctx.restore();

      // 6. Steel Broadsword
      ctx.save();
      ctx.translate(swordX, bodyY + 48 + swordY);
      ctx.rotate(swordAngle);

      ctx.fillStyle = steelHilt; ctx.fillRect(-6, -3, 12, 3);
      ctx.fillStyle = bracerDark; ctx.fillRect(-1.5, 0, 3, 6);
      ctx.fillStyle = steelHilt; ctx.beginPath(); ctx.arc(0, 7, 2.5, 0, Math.PI * 2); ctx.fill();

      ctx.fillStyle = steelBlade;
      ctx.beginPath();
      ctx.moveTo(-3, -3); ctx.lineTo(3, -3); ctx.lineTo(1.5, -swordLength); ctx.lineTo(0, -swordLength - 4); ctx.lineTo(-1.5, -swordLength);
      ctx.closePath(); ctx.fill();

      ctx.fillStyle = steelShadow; ctx.fillRect(-0.6, -3, 1.2, swordLength - 4);
      ctx.fillStyle = '#ffffff'; ctx.fillRect(1.5, -swordLength + 2, 1, swordLength - 6);

      ctx.restore();

      // Slash Arc
      if (showSlashArc) {
        ctx.save();
        ctx.strokeStyle = 'rgba(255, 255, 255, 0.85)';
        ctx.lineWidth = 3.5;
        ctx.shadowColor = '#38bdf8';
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.arc(8, bodyY + 32, 34, -0.4, 0.9);
        ctx.stroke();
        ctx.restore();
      }

      if (isDashing) {
        ctx.fillStyle = 'rgba(245, 158, 11, 0.35)';
        ctx.beginPath();
        ctx.moveTo(-16, bodyY + 20); ctx.lineTo(-38, bodyY + 16); ctx.lineTo(-30, bodyY + 36);
        ctx.closePath(); ctx.fill();
      }

      ctx.restore();
    }

    // ==========================================
    // 4. PARALLAX ENVIRONMENT & PLATFORM RENDERER
    // ==========================================
    function mulberry32(seed) {
      return function () {
        seed |= 0; seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function drawEnvironment(ctx, camX, canvasW, canvasH, envType = 'moss') {
      let baseColor = '#0b0f19'; let farColor = '#161e2e'; let midColor = '#1e293b';
      let glowColor = 'rgba(52, 211, 153, 0.15)';

      if (envType === 'crystal') {
        baseColor = '#0a0a1f'; farColor = '#1e1b4b'; midColor = '#312e81'; glowColor = 'rgba(56, 189, 248, 0.2)';
      } else if (envType === 'obsidian') {
        baseColor = '#180808'; farColor = '#2e0f0f'; midColor = '#451a1a'; glowColor = 'rgba(239, 68, 68, 0.18)';
      } else if (envType === 'biolum') {
        baseColor = '#0f051d'; farColor = '#240f42'; midColor = '#3b1768'; glowColor = 'rgba(192, 132, 252, 0.22)';
      }

      ctx.fillStyle = baseColor; ctx.fillRect(0, 0, canvasW, canvasH);

      // Ambient glows
      ctx.fillStyle = glowColor;
      const glowOffset = (camX * 0.1) % 400;
      for (let gx = -glowOffset; gx < canvasW + 200; gx += 300) {
        ctx.beginPath(); ctx.arc(gx, 150, 100, 0, Math.PI * 2); ctx.fill();
      }

      // Pillars
      ctx.fillStyle = farColor;
      const pillarOffset = (camX * 0.2) % 350;
      for (let px = -pillarOffset; px < canvasW + 200; px += 260) {
        ctx.beginPath(); ctx.moveTo(px, 0); ctx.lineTo(px + 40, 180); ctx.lineTo(px + 80, 0); ctx.closePath(); ctx.fill();
      }

      ctx.fillStyle = midColor;
      const midOffset = (camX * 0.45) % 450;
      for (let mx = -midOffset; mx < canvasW + 200; mx += 320) {
        ctx.beginPath(); ctx.moveTo(mx, 0); ctx.lineTo(mx + 50, 130); ctx.lineTo(mx + 110, 0); ctx.closePath(); ctx.fill();
      }
    }

    function drawRockPlatform(ctx, x, y, width, height, envType = 'moss') {
      const rng = mulberry32(Math.round(x * 31 + y * 17));
      const bumpCount = Math.max(4, Math.round(width / 26));
      const bumpW = width / bumpCount;
      const jag = Math.min(8, height * 0.35);

      const topPoints = [];
      for (let i = 0; i <= bumpCount; i++) {
        topPoints.push([x + i * bumpW, y + (rng() - 0.5) * jag]);
      }

      ctx.save();
      ctx.beginPath();
      ctx.moveTo(x, y + height);
      ctx.lineTo(topPoints[0][0], topPoints[0][1]);
      for (let i = 1; i < topPoints.length; i++) ctx.lineTo(topPoints[i][0], topPoints[i][1]);
      ctx.lineTo(x + width, y + height);
      ctx.closePath();

      const grad = ctx.createLinearGradient(0, y, 0, y + height);
      grad.addColorStop(0, '#334155'); grad.addColorStop(0.4, '#1e293b'); grad.addColorStop(1, '#0f172a');
      ctx.fillStyle = grad; ctx.fill();

      ctx.strokeStyle = envType === 'crystal' ? 'rgba(56, 189, 248, 0.6)' : 'rgba(52, 211, 153, 0.6)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(topPoints[0][0], topPoints[0][1] + 2);
      for (let i = 1; i < topPoints.length; i++) ctx.lineTo(topPoints[i][0], topPoints[i][1] + 2);
      ctx.stroke();

      ctx.restore();
    }
