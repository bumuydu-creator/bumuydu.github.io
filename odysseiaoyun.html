  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Sound Engine ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSlash() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      }
      playSpell() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
      playHit() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
      }
      playPickup() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.setValueAtTime(780, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.18);
      }
      playJump() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(360, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      }
      playExplosion() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.4);
      }
    }
    const sound = new SoundEngine();

        hpMax: 120, manaMax: 80, attackPower: 22, speed: 6.5, critRate: 20,

        skillDescription: 'Hızla ileri atılarak düşmanları keser.',

      },

      },

    const CAVERN_LEVELS = [

    // --- Main App Component ---
    function App() {
      const [currentView, setCurrentView] = useState('game');

      const [crystals, setCrystals] = useState(240);
      const [score, setScore] = useState(0);

      return (
        <div className="min-h-screen bg-[#0d1117] text-[#c9d1d9] font-mono flex flex-col">
          {/* Header */}
          <header className="h-16 border-b border-[#30363d] bg-[#161b22] px-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-[#238636] flex items-center justify-center font-bold text-white text-lg">O</div>
              <div>
                <div className="text-sm font-bold text-white">ODESSIA / SINGLE_HTML</div>
                <div className="text-[10px] text-[#8b949e]">GitHub Pages Ready Engine</div>
              </div>
            </div>

            <div className="flex items-center gap-4 text-xs">
              <div className="text-[#3fb950] font-bold">💎 {crystals} CR</div>
              <button 
                onClick={() => setCurrentView('game')}
                className={`px-3 py-1 rounded ${currentView === 'game' ? 'bg-[#238636] text-white' : 'bg-[#21262d] text-[#8b949e]'}`}
              >
                Aksiyon Oyunu
              </button>
              <button 
                onClick={() => setCurrentView('map')}
                className={`px-3 py-1 rounded ${currentView === 'map' ? 'bg-[#238636] text-white' : 'bg-[#21262d] text-[#8b949e]'}`}
              >
                Harita
              </button>
            </div>
          </header>

          {/* Main Area */}
          <main className="p-4 max-w-5xl mx-auto w-full flex-1">
            {currentView === 'game' && (
              <div className="bento-card p-4 space-y-4">
                <div className="flex items-center justify-between">
                  <h2 className="text-lg font-bold text-white">2D ODESSIA ACTION CANVAS</h2>
                  <div className="text-xs text-[#8b949e]">Kontroller: A/D: Sol/Sağ | W: Zıpla | J: Saldırı | K: Skill</div>
                </div>

                <div className="relative w-full aspect-[2/1] bg-[#0d1117] rounded-xl border border-[#30363d] overflow-hidden flex flex-col items-center justify-center text-center p-6">
                  <div className="text-[#3fb950] font-bold text-2xl mb-2">⚔️ ODESSIA CANLI SAVAŞ MOTORU</div>
                  <p className="text-xs text-[#8b949e] max-w-md mb-4">
                    Bu oyun HTML5 Canvas, Web Audio API ve React 18 ile tamamen tek bir index.html dosyası olarak derlenmiştir. GitHub Pages veya herhangi bir statik sunucuda direkt çalışır!
                  </p>
                  <div className="flex gap-2">
                    {HEROES.map((h) => (
                      <button
                        key={h.id}
                        onClick={() => setSelectedHero(h)}
                        className={`px-3 py-1.5 rounded text-xs font-bold transition-all ${selectedHero.id === h.id ? 'bg-[#238636] text-white' : 'bg-[#21262d] text-[#8b949e]'}`}
                      >
                        {h.name} ({h.role})

                    ))}

                </div>
              </div>
            )}

            {currentView === 'map' && (
              <div className="bento-card p-6 space-y-4">
                <h2 className="text-lg font-bold text-white">MAĞARA DIORAMA HARİTASI</h2>
                <div className="grid grid-cols-2 sm:grid-cols-3 gap-3">
                  {CAVERN_LEVELS.map((lvl) => (
                    <div key={lvl.id} className="p-4 bg-[#0d1117] border border-[#30363d] rounded-lg">
                      <div className="text-xs text-[#3fb950] font-bold">SEVİYE {lvl.levelNum}</div>
                      <div className="text-sm font-bold text-white">{lvl.name}</div>
                      <div className="text-[10px] text-[#8b949e] mt-1">{lvl.threat} TEHDİT</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
