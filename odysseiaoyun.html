function pickN(arr, n) {
  const copy = [...arr];
  const out = [];
  for (let i = 0; i < n && copy.length; i++) {
    out.push(copy.splice(Math.floor(Math.random() * copy.length), 1)[0]);
  }
  return out;
}

function mockSynthesize(items) {
  const adj = RELIC_ADJECTIVES[Math.floor(Math.random() * RELIC_ADJECTIVES.length)];
  const mat = RELIC_MATERIALS[Math.floor(Math.random() * RELIC_MATERIALS.length)];
  const noun = RELIC_NOUNS[Math.floor(Math.random() * RELIC_NOUNS.length)];
  const rarityWeight = items.some((i) => i.rarity === 'Efsanevi') ? 3 : items.some((i) => i.rarity === 'Kadim') ? 2 : 1;
  const tier = rarityWeight >= 3 ? 'Kademe 3' : rarityWeight === 2 ? 'Kademe 2' : Math.random() > 0.6 ? 'Kademe 2' : 'Kademe 1';
  const base = tier === 'Kademe 3' ? 85 : tier === 'Kademe 2' ? 72 : 60;
  const resonanceScore = Math.min(99, base + Math.floor(Math.random() * 15));
  const itemNames = items.map((i) => i.name.toLowerCase()).join(', ');
  return {
    relicName: `${adj} ${mat} ${noun}`,
    tier,
    resonanceScore,
    description: `${itemNames} malzemelerinin dikkatle birleştirilmiş bir kaynaşımı, yüzeyi oyma kristal ile keçeleşmiş yün arasında değişiyor.`,
    perks: pickN(PERK_POOL, 2),
    loreFlavor: FLAVOR_POOL[Math.floor(Math.random() * FLAVOR_POOL.length)],
  };
}

// EchoSynthesis
// ============================================================

function EchoSynthesis({ inventory, history, onAddHistory }) {
  const [selectedIds, setSelectedIds] = useState([]);
  const [loading, setLoading] = useState(false);
  const [result, setResult] = useState(null);

  const toggleItem = (id) => {
    setSelectedIds((prev) => (prev.includes(id) ? prev.filter((x) => x !== id) : prev.length < 4 ? [...prev, id] : prev));
  };

  const selectedItems = inventory.filter((i) => selectedIds.includes(i.id));

  const handleSynthesize = () => {
    if (selectedItems.length < 2 || loading) return;
    setLoading(true);
    setResult(null);
    setTimeout(() => {
      const relic = mockSynthesize(selectedItems);
      const withMeta = { ...relic, id: `h${Date.now()}`, createdTime: 'Az önce' };
      setResult(withMeta);
      onAddHistory(withMeta);
      setSelectedIds([]);
      setLoading(false);
    }, 1100);
  };

  const tierColor = result?.tier === 'Kademe 3' ? '#c084fc' : result?.tier === 'Kademe 2' ? '#38bdf8' : '#34d399';

  return (
    <div className="space-y-6">
      <div>
        <h1 className="font-display text-2xl sm:text-3xl text-zinc-100">Yankı Sentezi Atölyesi</h1>
        <p className="text-zinc-500 text-sm mt-1">2-4 toplanmış malzemeyi birleştir ve Rezonans Kâhini onları bağlasın.</p>
      </div>

      <div className="grid md:grid-cols-5 gap-6">
        <div className="md:col-span-2 bento-card p-4 space-y-2 max-h-[480px] overflow-y-auto">
          <div className="font-mono text-[10px] tracking-widest text-zinc-500 uppercase px-1 pb-1">Malzemelerin</div>
          {inventory.map((item) => {
            const isSelected = selectedIds.includes(item.id);
            return (
              <button
                key={item.id}
                onClick={() => toggleItem(item.id)}
                className={`w-full flex items-center gap-3 p-2.5 rounded-xl border transition-colors text-left ${
                  isSelected ? 'border-emerald-500/60 bg-emerald-500/10' : 'border-zinc-800 hover:border-zinc-700'
                }`}
              >
                <div className="w-9 h-9 rounded-lg flex items-center justify-center shrink-0" style={{ backgroundColor: `${item.color}22` }}>
                  <Icon name={item.icon} className="text-[18px]" style={{ color: item.color }} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="text-sm text-zinc-200 truncate">{item.name}</div>
                  <div className="font-mono text-[10px]" style={{ color: RARITY_COLORS[item.rarity] }}>{item.rarity}</div>
                </div>
                <span className="font-mono text-xs text-zinc-500">×{item.quantity}</span>
              </button>
            );
          })}
        </div>

        <div className="md:col-span-3 chiseled-slab p-6 flex flex-col items-center justify-center text-center min-h-[300px]">
          {!result && !loading && (
            <>
              <Icon name="diamond" className="text-emerald-400 text-[42px] mb-3 crystal-glow-cyan" />
              <p className="text-zinc-400 text-sm mb-5 max-w-xs">
                {selectedItems.length === 0
                  ? 'Başlamak için envanterinden 2-4 malzeme seç.'
                  : `${selectedItems.length} malzeme seçildi: ${selectedItems.map((i) => i.name).join(', ')}`}
              </p>
              <button
                onClick={handleSynthesize}
                disabled={selectedItems.length < 2}
                className="px-6 py-3 rounded-xl bg-emerald-500/15 border border-emerald-500/50 text-emerald-400 font-medium disabled:opacity-30 disabled:cursor-not-allowed hover:bg-emerald-500/25 transition-colors"
              >
                Yankıları Sentezle
              </button>
            </>
          )}
          {loading && (
            <>
              <div className="w-10 h-10 rounded-full border-2 border-emerald-500/30 border-t-emerald-400 animate-spin mb-4" />
              <p className="font-mono text-xs text-zinc-500 tracking-wide">Rezonans Kâhini yankılarını hizalıyor…</p>
            </>
          )}
          {result && !loading && (
            <div className="w-full text-left">
              <div className="flex items-center justify-between mb-2">
                <span className="font-mono text-[10px] tracking-widest uppercase px-2 py-0.5 rounded-full border" style={{ color: tierColor, borderColor: `${tierColor}55`, backgroundColor: `${tierColor}1a` }}>
                  {result.tier}
                </span>
                <span className="font-display text-2xl" style={{ color: tierColor }}>{result.resonanceScore}</span>
              </div>
              <h3 className="font-display text-xl text-zinc-100 mb-2">{result.relicName}</h3>
              <p className="text-zinc-400 text-sm leading-relaxed mb-3">{result.description}</p>
              <div className="flex flex-wrap gap-2 mb-3">
                {result.perks.map((p) => <span key={p} className="moss-tag">{p}</span>)}
              </div>
              <p className="text-zinc-500 text-xs italic mb-5">{result.loreFlavor}</p>
              <button onClick={() => setResult(null)} className="text-sm text-emerald-400 hover:underline">Bir tane daha sentezle</button>
            </div>
          )}
        </div>
      </div>

      <div>
        <div className="font-mono text-[10px] tracking-widest text-zinc-500 uppercase mb-3">Sentez güncesi</div>
        <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
          {history.map((relic) => (
            <div key={relic.id} className="bento-card p-4">
              <div className="flex items-center justify-between mb-1.5">
                <span className="font-mono text-[10px] text-zinc-500 uppercase">{relic.tier}</span>
                <span className="font-mono text-xs text-emerald-400">{relic.resonanceScore}</span>
              </div>
              <div className="font-display text-sm text-zinc-200 mb-1">{relic.relicName}</div>
              <div className="text-zinc-500 text-xs">{relic.createdTime}</div>
            </div>
          ))}
        </div>
      </div>
    </div>
  );
}

const CHRONICLE_CATEGORIES = ['Tümü', 'Yaratıklar', 'Anomaliler', 'Runiler', 'Tarih'];

function Chronicle({ entries }) {
  const [filter, setFilter] = useState('Tümü');
  const [decrypted, setDecrypted] = useState({});
  const [loadingId, setLoadingId] = useState(null);

  const visible = filter === 'Tümü' ? entries : entries.filter((e) => e.category === filter);

  const handleDecrypt = (entry) => {
    setLoadingId(entry.id);
    setTimeout(() => {
      setDecrypted((prev) => ({ ...prev, [entry.id]: mockDecrypt(entry) }));
      setLoadingId(null);
    }, 900);
  };

  return (
    <div className="space-y-6">
      <div>
        <h1 className="font-display text-2xl sm:text-3xl text-zinc-100">Gölgeler Güncesi</h1>
        <p className="text-zinc-500 text-sm mt-1">Derinlerden kaydedilen efsaneler, yaratıklar ve anomaliler.</p>
      </div>

      <div className="flex flex-wrap gap-2">
        {CHRONICLE_CATEGORIES.map((cat) => (
          <button
            key={cat}
            onClick={() => setFilter(cat)}
            className={`px-3.5 py-1.5 rounded-full text-xs font-mono tracking-wide border transition-colors ${
              filter === cat ? 'border-emerald-500/60 bg-emerald-500/10 text-emerald-400' : 'border-zinc-800 text-zinc-500 hover:text-zinc-300'
            }`}
          >
            {cat.toUpperCase()}
          </button>
        ))}
      </div>

      <div className="grid md:grid-cols-2 gap-4">
        {visible.map((entry) => (
          <div key={entry.id} className="bento-card p-5">
            <div className="flex items-start justify-between gap-3 mb-2">
              <div>
                <h3 className="font-display text-lg text-zinc-100">{entry.title}</h3>
                <p className="text-zinc-500 text-xs mt-0.5">{entry.subtitle}</p>
              </div>
              {entry.threatTag && (
                <span
                  className="font-mono text-[10px] tracking-widest uppercase px-2 py-0.5 rounded-full border shrink-0"
                  style={{ color: entry.threatColor, borderColor: `${entry.threatColor}55`, backgroundColor: `${entry.threatColor}1a` }}
                >
                  {entry.threatTag}
                </span>
              )}
            </div>
            <p className="text-zinc-400 text-sm leading-relaxed mb-3">{entry.description}</p>
            <div className="mb-3">
              <div className="flex justify-between font-mono text-[10px] text-zinc-500 mb-1">
                <span>REZONANS SEVİYESİ</span><span>{entry.resonanceLevel}%</span>
              </div>
              <div className="resonance-crack">
                <div className="resonance-fill" style={{ width: `${entry.resonanceLevel}%` }} />
              </div>
            </div>

            {decrypted[entry.id] ? (
              <div className="rope-line pt-3 mt-3">
                {decrypted[entry.id].split('\n\n').map((p, i) => (
                  <p key={i} className="text-zinc-300 text-sm leading-relaxed mb-2 last:mb-0">{p}</p>
                ))}
              </div>
            ) : (
              <button
                onClick={() => handleDecrypt(entry)}
                disabled={loadingId === entry.id}
                className="flex items-center gap-2 text-xs font-mono tracking-wide text-emerald-400 hover:text-emerald-300 disabled:opacity-50 transition-colors"
              >
                <Icon name={loadingId === entry.id ? 'progress_activity' : 'key'} className={`text-[16px] ${loadingId === entry.id ? 'animate-spin' : ''}`} />
                {loadingId === entry.id ? 'Şifre çözülüyor…' : 'Sırrı çöz'}
              </button>
            )}
          </div>
        ))}
      </div>
    </div>
  );
}

function DelverModal({ isOpen, onClose, profile, quests, onClaimQuest }) {
  const [messages, setMessages] = useState([
    { from: 'thistle', text: 'Hoş geldin, kâşif. Bana derinlik hakkında sor, eski taşın izin verdiği kadarıyla yanıtlayayım.' },
  ]);
  const [input, setInput] = useState('');
  const [chatLoading, setChatLoading] = useState(false);
  const scrollRef = useRef(null);

  useEffect(() => {
    if (scrollRef.current) scrollRef.current.scrollTop = scrollRef.current.scrollHeight;
  }, [messages]);

  if (!isOpen) return null;

  const handleSend = () => {
    const text = input.trim();
    if (!text || chatLoading) return;
    setMessages((prev) => [...prev, { from: 'user', text }]);
    setInput('');
    setChatLoading(true);
    setTimeout(() => {
      setMessages((prev) => [...prev, { from: 'thistle', text: mockChatReply(text) }]);
      setChatLoading(false);
    }, 800);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-black/70 backdrop-blur-sm" onClick={onClose} />
      <div className="relative chiseled-slab w-full max-w-2xl max-h-[85vh] overflow-y-auto p-6 sm:p-8">
        <button onClick={onClose} className="absolute top-5 right-5 text-zinc-500 hover:text-zinc-200">
          <Icon name="close" className="text-[22px]" />
        </button>

        <div className="flex items-center gap-4 mb-6">
          <div className="w-16 h-16 rounded-full bg-zinc-800 border-2 border-emerald-500/50 flex items-center justify-center crystal-glow-cyan">
            <Icon name="person" className="text-[30px] text-zinc-300" />
          </div>
          <div>
            <div className="font-display text-xl text-zinc-100">{profile.name}</div>
            <div className="text-zinc-500 text-sm">{profile.title}</div>
            <div className="font-mono text-[10px] text-emerald-400 tracking-widest mt-0.5">SEVİYE {profile.level}</div>
          </div>
        </div>

        <div className="grid grid-cols-2 gap-4 mb-6">
          <div>
            <div className="flex justify-between font-mono text-[10px] text-zinc-500 mb-1.5"><span>PARLAKLIK</span><span>{profile.luminescence}%</span></div>
            <div className="resonance-crack"><div className="resonance-fill" style={{ width: `${profile.luminescence}%`, background: '#f59e0b', boxShadow: '0 0 12px rgba(245,158,11,0.8)' }} /></div>
          </div>
          <div>
            <div className="flex justify-between font-mono text-[10px] text-zinc-500 mb-1.5"><span>REZONANS</span><span>{profile.resonance}%</span></div>
            <div className="resonance-crack"><div className="resonance-fill" style={{ width: `${profile.resonance}%` }} /></div>
          </div>
        </div>

        <div className="mb-6">
          <div className="font-mono text-[10px] tracking-widest text-zinc-500 uppercase mb-3">Görevler</div>
          <div className="space-y-2.5">
            {quests.map((q) => (
              <div key={q.id} className="stone-slab p-3.5">
                <div className="flex items-center justify-between mb-1.5">
                  <span className="text-sm text-zinc-200">{q.title}</span>
                  {q.isCompleted ? (
                    <span className="moss-tag">Tamamlandı</span>
                  ) : (
                    <button
                      onClick={() => onClaimQuest(q.id)}
                      disabled={q.progress < q.maxProgress}
                      className="font-mono text-[10px] tracking-widest uppercase text-emerald-400 disabled:text-zinc-600 disabled:cursor-not-allowed"
                    >
                      Talep Et
                    </button>
                  )}
                </div>
                <p className="text-zinc-500 text-xs mb-2">{q.objective} · {q.reward}</p>
                <div className="resonance-crack h-1">
                  <div className="resonance-fill" style={{ width: `${Math.min(100, (q.progress / q.maxProgress) * 100)}%` }} />
                </div>
              </div>
            ))}
          </div>
        </div>

        <div>
          <div className="font-mono text-[10px] tracking-widest text-zinc-500 uppercase mb-3">Thistle'a Fısılda</div>
          <div ref={scrollRef} className="stone-slab p-3.5 h-40 overflow-y-auto space-y-2.5 mb-3">
            {messages.map((m, i) => (
              <div key={i} className={`text-sm leading-relaxed ${m.from === 'user' ? 'text-zinc-300 text-right' : 'text-emerald-300/90'}`}>
                {m.from === 'thistle' && <span className="font-mono text-[10px] text-zinc-600 block mb-0.5">THISTLE</span>}
                {m.text}
              </div>
            ))}
            {chatLoading && <div className="font-mono text-[10px] text-zinc-600">Thistle taşı dinliyor…</div>}
          </div>
          <div className="flex gap-2">
            <input
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={(e) => e.key === 'Enter' && handleSend()}
              placeholder="Tehlike, kalıntı veya runiler hakkında sor…"
              className="flex-1 bg-zinc-900 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-zinc-200 placeholder:text-zinc-600 focus:outline-none focus:border-emerald-500/60"
            />
            <button onClick={handleSend} className="w-11 h-11 rounded-xl bg-emerald-500/15 border border-emerald-500/50 flex items-center justify-center text-emerald-400 hover:bg-emerald-500/25 transition-colors shrink-0">
              <Icon name="send" className="text-[18px]" />
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ============================================================
// MobileBottomNav
// ============================================================

function MobileBottomNav({ currentView, onViewChange, onOpenProfile }) {
  return (
    <nav className="md:hidden fixed bottom-0 inset-x-0 z-30 border-t border-zinc-800/80 bg-[#09090b]/95 backdrop-blur-md flex justify-around py-2">
      {NAV_ITEMS.map((item) => (
        <button
          key={item.id}
          onClick={() => onViewChange(item.id)}
          className={`flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg ${currentView === item.id ? 'text-emerald-400' : 'text-zinc-500'}`}
        >
          <Icon name={item.icon} className="text-[22px]" />
          <span className="font-mono text-[9px]">{item.label.split(' ')[0]}</span>
        </button>
      ))}
      <button onClick={onOpenProfile} className="flex flex-col items-center gap-0.5 px-3 py-1 rounded-lg text-zinc-500">
        <Icon name="person" className="text-[22px]" />
        <span className="font-mono text-[9px]">Profil</span>
      </button>
    </nav>
  );
}

// ============================================================
// App
// ============================================================

function App() {
  const [currentView, setCurrentView] = useState('map');
  const [profile, setProfile] = useState(initialDelverProfile);
  const [nodes] = useState(initialCavernNodes);
  const [inventory] = useState(initialGatheredItems);
  const [loreEntries] = useState(initialLoreEntries);
  const [quests, setQuests] = useState(initialQuests);
  const [history, setHistory] = useState(initialSynthesizedHistory);
  const [isProfileModalOpen, setIsProfileModalOpen] = useState(false);

  const handleAddHistory = (relic) => {
    setHistory((prev) => [relic, ...prev]);
    setProfile((prev) => ({ ...prev, resonance: Math.min(100, prev.resonance + 2) }));
  };

  const handleClaimQuest = (questId) => {
    setQuests((prev) => prev.map((q) => (q.id === questId ? { ...q, isCompleted: true, progress: q.maxProgress } : q)));
    setProfile((prev) => ({ ...prev, luminescence: Math.min(100, prev.luminescence + 5) }));
  };

  return (
    <div className="min-h-screen bg-[#09090b] text-[#f4f4f5] font-body felt-texture flex flex-col">
      <Header
        currentView={currentView}
        onViewChange={setCurrentView}
        luminescence={profile.luminescence}
        resonance={profile.resonance}
        onOpenProfile={() => setIsProfileModalOpen(true)}
      />

      <div className="flex flex-1 pt-20 pb-24 md:pb-12">
        <SidebarNav
          currentView={currentView}
          onViewChange={setCurrentView}
          activeDepth={profile.activeDepth}
          resonance={profile.resonance}
          onOpenQuests={() => setIsProfileModalOpen(true)}
        />

        <main className="flex-1 px-4 sm:px-6 md:px-12 md:ml-64 py-6 max-w-6xl mx-auto w-full transition-all">
          {currentView === 'map' && (
            <CavernMap
              nodes={nodes}
              profile={profile}
              inventory={inventory}
              onNavigateToView={setCurrentView}
              onOpenProfile={() => setIsProfileModalOpen(true)}
            />
          )}
          {currentView === 'synthesis' && (
            <EchoSynthesis inventory={inventory} history={history} onAddHistory={handleAddHistory} />
          )}
          {currentView === 'chronicle' && <Chronicle entries={loreEntries} />}
          {currentView === 'inventory' && (
            <InventoryView inventory={inventory} capacity={profile.inventoryCapacity} onNavigateToView={setCurrentView} />
          )}
        </main>
      </div>

      <DelverModal
        isOpen={isProfileModalOpen}
        onClose={() => setIsProfileModalOpen(false)}
        profile={profile}
        quests={quests}
        onClaimQuest={handleClaimQuest}
      />

      <MobileBottomNav
        currentView={currentView}
        onViewChange={setCurrentView}
        onOpenProfile={() => setIsProfileModalOpen(true)}
      />
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);

  </script>
</body>
</html>
