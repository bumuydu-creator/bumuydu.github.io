  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Sound Engine ---
    class SoundEngine {
      constructor() {
        this.ctx = null;
        this.enabled = true;
      }
      init() {
        if (!this.ctx) {
          const AudioCtx = window.AudioContext || window.webkitAudioContext;
          if (AudioCtx) this.ctx = new AudioCtx();
        }
        if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
      }
      playSlash() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(420, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      }
      playSpell() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(300, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(880, this.ctx.currentTime + 0.25);
        gain.gain.setValueAtTime(0.25, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.25);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.25);
      }
      playHit() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(150, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.1);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.1);
      }
      playPickup() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(520, this.ctx.currentTime);
        osc.frequency.setValueAtTime(780, this.ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.18);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.18);
      }
      playJump() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(180, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(360, this.ctx.currentTime + 0.12);
        gain.gain.setValueAtTime(0.2, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.12);
      }
      playExplosion() {
        if (!this.enabled) return;
        this.init(); if (!this.ctx) return;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(100, this.ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(20, this.ctx.currentTime + 0.4);
        gain.gain.setValueAtTime(0.5, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, this.ctx.currentTime + 0.4);
        osc.connect(gain); gain.connect(this.ctx.destination);
        osc.start(); osc.stop(this.ctx.currentTime + 0.4);
      }
    }
    const sound = new SoundEngine();

    // Draws a small heroic swordsman silhouette — head, bronze helm, cape,
    // tunic, legs, and an arm holding a sword — instead of a flat color
    // rectangle. All coordinates are relative to the sprite's own local
    // space; ctx.scale(dir, 1) below mirrors the whole drawing for
    // left-facing without needing a second set of coordinates.
    function drawHeroSprite(ctx, px, py, width, height, facing, color, secondaryColor, isAttacking) {
      const dir = facing === 'right' ? 1 : -1;
      const originX = px + width / 2;
      ctx.save();
      ctx.translate(originX, py);
      ctx.scale(dir, 1);

      const headR = width * 0.22;
      const headCY = headR + 2;

      // Cape, billowing slightly behind
      ctx.fillStyle = secondaryColor;
      ctx.beginPath();
      ctx.moveTo(-width * 0.18, headCY + headR * 0.5);
      ctx.quadraticCurveTo(-width * 0.68, height * 0.5, -width * 0.32, height * 0.95);
      ctx.quadraticCurveTo(-width * 0.1, height * 0.55, -width * 0.08, headCY + headR * 0.7);
      ctx.closePath();
      ctx.fill();

      // Legs
      ctx.fillStyle = '#8a6b4d';
      ctx.fillRect(-width * 0.17, height * 0.64, width * 0.15, height * 0.36);
      ctx.fillRect(width * 0.02, height * 0.64, width * 0.15, height * 0.36);

      // Back arm (behind torso, mostly hidden)
      ctx.fillStyle = color;
      ctx.fillRect(-width * 0.32, headCY + headR * 0.8, width * 0.12, height * 0.3);

      // Tunic
      ctx.beginPath();
      ctx.moveTo(-width * 0.26, headCY + headR * 0.7);
      ctx.lineTo(width * 0.26, headCY + headR * 0.7);
      ctx.lineTo(width * 0.32, height * 0.66);
      ctx.lineTo(-width * 0.32, height * 0.66);
      ctx.closePath();
      ctx.fill();

      // Belt
      ctx.fillStyle = '#f0c419';
      ctx.fillRect(-width * 0.3, height * 0.42, width * 0.6, height * 0.07);

      // Head + bronze helm
      ctx.fillStyle = '#e8c9a0';
      ctx.beginPath();
      ctx.arc(0, headCY, headR, 0, Math.PI * 2);
      ctx.fill();
      ctx.fillStyle = secondaryColor;
      ctx.beginPath();
      ctx.arc(0, headCY - headR * 0.1, headR * 1.05, Math.PI * 1.05, Math.PI * 1.95);
      ctx.fill();
      ctx.fillRect(-1.5, headCY - headR * 1.6, 3, headR * 0.9); // helm crest

      // Front arm + sword — two simple fixed poses (idle vs mid-swing),
      // deliberately not trig-driven so the pose stays predictable.
      const shoulderX = width * 0.22;
      const shoulderY = headCY + headR * 0.8;
      let handX, handY, bladeTipX, bladeTipY;
      if (isAttacking) {
        handX = shoulderX + width * 0.5;
        handY = shoulderY - height * 0.05;
        bladeTipX = handX + width * 0.55;
        bladeTipY = handY + height * 0.35;
      } else {
        handX = shoulderX + width * 0.28;
        handY = shoulderY + height * 0.22;
        bladeTipX = handX + width * 0.18;
        bladeTipY = handY + height * 0.34;
      }

      ctx.strokeStyle = color;
      ctx.lineWidth = Math.max(3, width * 0.1);
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(shoulderX, shoulderY);
      ctx.lineTo(handX, handY);
      ctx.stroke();

      ctx.strokeStyle = '#e6edf3';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(handX, handY);
      ctx.lineTo(bladeTipX, bladeTipY);
      ctx.stroke();

      ctx.strokeStyle = '#f0c419';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(handX - 5, handY - 3);
      ctx.lineTo(handX + 5, handY + 3);
      ctx.stroke();

      ctx.restore();
    }

    // --- Game Data ---
    const HEROES = [
      {
        id: 'odessia_blade',
        name: 'Odessia',
        title: 'Kılıç Dansçısı',
        role: 'Blade Dancer',
        avatarUrl: 'https://images.unsplash.com/photo-1578632767115-351597cf2477?w=300&auto=format&fit=crop&q=80',
        description: 'Biyoışıldayan kılıçlarıyla mağara karanlığını yaran hızlı ve çevik savaşçı.',
        color: '#34d399',
        secondaryColor: '#059669',
        hpMax: 120, manaMax: 80, attackPower: 22, speed: 6.5, critRate: 20,
        skillName: 'Rüzgar Çentiği', skillIcon: 'bolt', skillCooldownSec: 4,
        skillDescription: 'Hızla ileri atılarak düşmanları keser.',
        ultimateName: 'Biyoışık Kasırgası', ultimateDescription: '360 derece dönen yeşil bıçaklar fırlatır.'
      },
      {
        id: 'lumina_mage',
        name: 'Lumina',
        title: 'Kristal Büyücüsü',
        role: 'Crystal Mage',
        avatarUrl: 'https://images.unsplash.com/photo-1534447677768-be436bb09401?w=300&auto=format&fit=crop&q=80',
        description: 'Yeraltı kristallerinden güç alan, uzaktan patlamalar yaratan kâhin.',
        color: '#38bdf8',
        secondaryColor: '#0284c7',
        hpMax: 90, manaMax: 140, attackPower: 28, speed: 5.2, critRate: 15,
        skillName: 'Kristal Patlaması', skillIcon: 'auto_awesome', skillCooldownSec: 5,
        skillDescription: 'Hedef noktada patlayan kristal şok dalgası.',
        ultimateName: 'Yankı Kalkanı', ultimateDescription: 'Koruyucu bariyer ve enerji patlaması.'
      },
      {
        id: 'kaelen_rogue',
        name: 'Kaelen',
        title: 'Gölge Avcısı',
        role: 'Shadow Rogue',
        avatarUrl: 'https://images.unsplash.com/photo-1563089145-599997674d42?w=300&auto=format&fit=crop&q=80',
        description: 'Gölgelerde kaybolan, kritik darbeler vuran suikastçı.',
        color: '#c084fc',
        secondaryColor: '#7e22ce',
        hpMax: 100, manaMax: 100, attackPower: 25, speed: 7.2, critRate: 35,
        skillName: 'Gölge Adımı', skillIcon: 'visibility_off', skillCooldownSec: 3.5,
        skillDescription: 'Düşmanın arkasına ışınlanır.',
        ultimateName: 'Bıçak Yağmuru', ultimateDescription: 'Aşağıya 12 rezonanslı bıçak yağdırır.'
      }
    ];

    const CAVERN_LEVELS = [
      { id: 's1', name: 'Yosunlu Eşik', levelNum: 1, icon: 'cottage', threat: 'SAFE', xPercent: 15, yPercent: 80 },
      { id: 's2', name: 'Damlataşı Çukuru', levelNum: 2, icon: 'water_drop', threat: 'LOW', xPercent: 30, yPercent: 65 },
      { id: 's3', name: 'Uğuldayan Damar', levelNum: 3, icon: 'graphic_eq', threat: 'MEDIUM', xPercent: 50, yPercent: 70 },
      { id: 's4', name: 'Obsidyen Çatlağı', levelNum: 4, icon: 'bolt', threat: 'MEDIUM', xPercent: 65, yPercent: 50 },
      { id: 's5', name: 'Biyoışıldayan Oyuk', levelNum: 5, icon: 'auto_awesome', threat: 'HIGH', xPercent: 50, yPercent: 30, bossName: 'Mantarımsı Muhafız' }
    ];

    // --- 2D Action Game Canvas Component ---
    function PlayableGameCanvas({ hero, stage, onStageComplete, onGameOver, onNextStage, hasNextStage, onBackToMap }) {
      const canvasRef = useRef(null);
      const [isPaused, setIsPaused] = useState(false);
      const [stageCleared, setStageCleared] = useState(false);
      const [isDead, setIsDead] = useState(false);
      const [score, setScore] = useState(0);
      const [collectedCrystals, setCollectedCrystals] = useState(0);
      const [showIntro, setShowIntro] = useState(true);

      const keysRef = useRef({});
      const mobileInputRef = useRef({ left: false, right: false, jump: false, attack: false, skill: false, ult: false });

      const gameStateRef = useRef({
        player: {
          x: 100, y: 300, vx: 0, vy: 0, width: 40, height: 56,
          hp: hero.hpMax, hpMax: hero.hpMax, mana: hero.manaMax, manaMax: hero.manaMax,
          isGrounded: false, facing: 'right', isAttacking: false, attackTimer: 0,
          skillCooldown: 0, ultCooldown: 0, animFrame: 0, animTimer: 0,
          isDashing: false, dashTimer: 0, comboCount: 0, comboTimer: 0
        },
        enemies: [],
        projectiles: [],
        particles: [],
        floatingTexts: [],
        crystals: [],
        cameraX: 0,
        worldWidth: 2400,
        screenShake: 0
      });

      // Random small offset so repeated hits don't render as one unreadable
      // stacked blob of digits (e.g. "-12" landing on top of "-12").
      const addFloatingText = (x, y, text, color = '#f59e0b') => {
        gameStateRef.current.floatingTexts.push({
          id: Math.random().toString(),
          x: x + (Math.random() * 20 - 10),
          y: y + (Math.random() * 10 - 5),
          text, color, life: 40
        });
      };

      const addParticles = (x, y, count, color) => {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 1;
          gameStateRef.current.particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            size: Math.random() * 4 + 2, color, life: 0, maxLife: Math.random() * 20 + 15
          });
        }
      };

      const initStage = useCallback(() => {
        const worldW = 2400;
        const enemies = [];
        const mobTypes = ['spider', 'bat', 'golem'];

        for (let i = 0; i < 12; i++) {
          const type = mobTypes[i % mobTypes.length];
          const x = 400 + i * 150 + Math.random() * 50;
          let hp = 40, color = '#34d399', speed = 2, name = 'Mantar Örümceği';
          if (type === 'bat') { hp = 30; color = '#c084fc'; speed = 3; name = 'Gölge Yarasası'; }
          else if (type === 'golem') { hp = 80; color = '#38bdf8'; speed = 1.2; name = 'Kuvars Golem'; }

          // NOTE: bats used to spawn anywhere between y=180 and y=280, which
          // is often above the player's max jump height (~130px). An
          // unreachable bat meant the stage could never be cleared, since
          // clearing requires every enemy to reach 0 HP. Bats now spawn
          // within 260-320, always inside jump range from the ground.
          enemies.push({
            id: 'mob_' + i, type, name, x, y: type === 'bat' ? 260 + Math.random() * 60 : 340,
            vx: 0, vy: 0, width: type === 'golem' ? 50 : 36, height: type === 'golem' ? 60 : 36,
            hp, hpMax: hp, color, speed, facing: 'left', attackCooldown: 0, isHit: false, hitTimer: 0
          });
        }

        if (stage.bossName || stage.levelNum >= 5) {
          enemies.push({
            id: 'boss_main', type: 'boss', name: stage.bossName || 'Biyoışıldayan Muhafız',
            x: 2000, y: 300, vx: 0, vy: 0, width: 80, height: 90, hp: 350, hpMax: 350,
            color: '#10b981', speed: 1.5, facing: 'left', attackCooldown: 0, isHit: false, hitTimer: 0
          });
        }

        gameStateRef.current = {
          player: {
            x: 100, y: 300, vx: 0, vy: 0, width: 40, height: 56,
            hp: hero.hpMax, hpMax: hero.hpMax, mana: hero.manaMax, manaMax: hero.manaMax,
            isGrounded: false, facing: 'right', isAttacking: false, attackTimer: 0,
            skillCooldown: 0, ultCooldown: 0, animFrame: 0, animTimer: 0,
            isDashing: false, dashTimer: 0, comboCount: 0, comboTimer: 0
          },
          enemies, projectiles: [], particles: [], floatingTexts: [], crystals: [],
          cameraX: 0, worldWidth: worldW, screenShake: 0
        };
        setIsDead(false); setStageCleared(false); setScore(0); setCollectedCrystals(0);
      }, [hero, stage]);

      useEffect(() => { initStage(); }, [initStage]);

      // Show a "new level" intro banner every time a stage loads, then auto-dismiss.
      useEffect(() => {
        setShowIntro(true);
        const t = setTimeout(() => setShowIntro(false), 2200);
        return () => clearTimeout(t);
      }, [stage]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          keysRef.current[e.key.toLowerCase()] = true;
          if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) e.preventDefault();
        };
        const handleKeyUp = (e) => { keysRef.current[e.key.toLowerCase()] = false; };
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, []);

      const triggerAttack = () => {
        const { player, enemies, projectiles } = gameStateRef.current;
        if (player.attackTimer > 0) return;
        player.attackTimer = 15;

        // Crystal Mage fires a ranged bolt instead of swinging melee. This
        // means her class can always poke a stray high-flying enemy even if
        // the player can't line up a jump-attack perfectly, and it actually
        // matches her "uzaktan patlamalar yaratan kâhin" description, which
        // the old code never implemented (every hero used the same melee
        // hitbox regardless of role).
        if (hero.role === 'Crystal Mage') {
          sound.playSpell();
          const dir = player.facing === 'right' ? 1 : -1;
          projectiles.push({
            x: player.x + player.width / 2,
            y: player.y + player.height / 2,
            vx: 11 * dir,
            width: 14, height: 14,
            damage: hero.attackPower,
            life: 90
          });
          addParticles(player.x + player.width / 2, player.y + player.height / 2, 4, hero.color);
          return;
        }

        player.isAttacking = true;
        sound.playSlash();

        const attackReach = hero.role === 'Blade Dancer' ? 70 : 50;
        const attackX = player.facing === 'right' ? player.x + player.width : player.x - attackReach;
        const attackBox = { x: attackX, y: player.y - 10, w: attackReach, h: player.height + 20 };

        let hitAny = false;
        enemies.forEach((enemy) => {
          if (enemy.hp <= 0) return;
          if (attackBox.x < enemy.x + enemy.width && attackBox.x + attackBox.w > enemy.x &&
              attackBox.y < enemy.y + enemy.height && attackBox.y + attackBox.h > enemy.y) {
            const isCrit = Math.random() * 100 < hero.critRate;
            const dmg = Math.round(hero.attackPower * (isCrit ? 1.8 : 1.0));
            enemy.hp -= dmg;
            enemy.isHit = true; enemy.hitTimer = 10;
            enemy.vx = player.facing === 'right' ? 6 : -6;

            addFloatingText(enemy.x + enemy.width / 2, enemy.y - 10, `${dmg}${isCrit ? ' CRİT!' : ''}`, isCrit ? '#f59e0b' : '#34d399');
            addParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 8, hero.color);
            sound.playHit();
            hitAny = true;
          }
        });
        if (hitAny) gameStateRef.current.screenShake = 6;
      };

      const triggerSkill = () => {
        const { player } = gameStateRef.current;
        if (player.skillCooldown > 0 || player.mana < 20) return;
        player.mana -= 20;
        player.skillCooldown = hero.skillCooldownSec * 60;
        sound.playSpell();

        player.isDashing = true; player.dashTimer = 12;
        player.vx = player.facing === 'right' ? 18 : -18;
        addParticles(player.x, player.y + player.height / 2, 15, hero.color);
        addFloatingText(player.x, player.y - 20, hero.skillName + '!', hero.color);
      };

      const triggerUltimate = () => {
        const { player, enemies } = gameStateRef.current;
        if (player.ultCooldown > 0 || player.mana < 50) return;
        player.mana -= 50;
        player.ultCooldown = 600;
        sound.playExplosion();
        gameStateRef.current.screenShake = 15;

        enemies.forEach((enemy) => {
          if (enemy.hp <= 0) return;
          const dist = Math.hypot(enemy.x - player.x, enemy.y - player.y);
          if (dist < 350) {
            const dmg = hero.attackPower * 3;
            enemy.hp -= dmg;
            enemy.isHit = true; enemy.hitTimer = 20;
            addFloatingText(enemy.x, enemy.y - 15, `${dmg} ULT!`, '#a371f7');
            addParticles(enemy.x, enemy.y, 15, '#a371f7');
          }
        });
        addFloatingText(player.x, player.y - 30, hero.ultimateName + '!', '#a371f7');
      };

      // Game Main Engine Loop
      useEffect(() => {
        let animId;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const platforms = [
          { x: 0, y: 400, width: 2400, height: 100, color: '#21262d' },
          { x: 300, y: 280, width: 180, height: 20, color: '#30363d' },
          { x: 600, y: 220, width: 220, height: 20, color: '#30363d' },
          { x: 950, y: 290, width: 160, height: 20, color: '#30363d' },
          { x: 1250, y: 210, width: 240, height: 20, color: '#30363d' },
          { x: 1600, y: 270, width: 200, height: 20, color: '#30363d' }
        ];

        // Escape-valve exit gate near the end of the cavern. Clearing the
        // stage still primarily means defeating every enemy, but if the
        // player fights their way past everyone and reaches the gate, the
        // stage now also counts as cleared. This guarantees a stage can
        // never become permanently stuck (e.g. from an edge-case enemy
        // spawn), while keeping "kill everything" as the normal, rewarded
        // way to play.
        const exitGateWidth = 150;

        const loop = () => {
          if (!isPaused && !isDead && !stageCleared && !showIntro) {
            const { player, enemies, projectiles, particles, floatingTexts, crystals, worldWidth } = gameStateRef.current;

            // Player Movement
            const left = keysRef.current['a'] || keysRef.current['arrowleft'] || mobileInputRef.current.left;
            const right = keysRef.current['d'] || keysRef.current['arrowright'] || mobileInputRef.current.right;
            const jump = keysRef.current['w'] || keysRef.current[' '] || keysRef.current['arrowup'] || mobileInputRef.current.jump;

            if (keysRef.current['j'] || keysRef.current['z']) triggerAttack();
            if (keysRef.current['k'] || keysRef.current['x']) triggerSkill();
            if (keysRef.current['l'] || keysRef.current['c']) triggerUltimate();

            if (!player.isDashing) {
              if (left) { player.vx = -hero.speed; player.facing = 'left'; }
              else if (right) { player.vx = hero.speed; player.facing = 'right'; }
              else player.vx *= 0.7;
            } else {
              player.dashTimer--;
              if (player.dashTimer <= 0) player.isDashing = false;
            }

            if (jump && player.isGrounded) {
              player.vy = -13; player.isGrounded = false; sound.playJump();
            }

            player.vy += 0.65; // gravity
            player.x += player.vx;
            player.y += player.vy;
            player.x = Math.max(0, Math.min(player.x, worldWidth - player.width));

            // Platform Collisions
            player.isGrounded = false;
            platforms.forEach((p) => {
              if (player.x + player.width > p.x && player.x < p.x + p.width &&
                  player.y + player.height >= p.y && player.y + player.height <= p.y + p.height + player.vy + 2 && player.vy >= 0) {
                player.y = p.y - player.height;
                player.vy = 0; player.isGrounded = true;
              }
            });

            // Camera follow
            gameStateRef.current.cameraX = Math.max(0, Math.min(player.x - 400, gameStateRef.current.worldWidth - 900));

            // Mana passive regen
            player.mana = Math.min(player.manaMax, player.mana + 0.1);
            if (player.attackTimer > 0) player.attackTimer--;
            if (player.skillCooldown > 0) player.skillCooldown--;
            if (player.ultCooldown > 0) player.ultCooldown--;

            // Update Enemies
            enemies.forEach((enemy) => {
              if (enemy.hp <= 0) return;
              if (enemy.hitTimer > 0) enemy.hitTimer--;

              // Patrol/chase
              const distToPlayer = Math.abs(player.x - enemy.x);
              if (distToPlayer < 400) {
                enemy.facing = player.x > enemy.x ? 'right' : 'left';
                enemy.vx = enemy.facing === 'right' ? enemy.speed : -enemy.speed;
              } else {
                enemy.vx = 0;
              }

              enemy.x += enemy.vx;

              // Enemy attacks player
              if (Math.abs(player.x - enemy.x) < 40 && Math.abs(player.y - enemy.y) < 50) {
                if (enemy.attackCooldown <= 0) {
                  player.hp -= 12;
                  enemy.attackCooldown = 60;
                  addFloatingText(player.x, player.y - 10, '-12', '#f85149');
                  gameStateRef.current.screenShake = 8;
                  sound.playHit();
                  if (player.hp <= 0) { setIsDead(true); onGameOver(); }
                }
              }
              if (enemy.attackCooldown > 0) enemy.attackCooldown--;
            });

            // Update Projectiles (ranged mage bolts)
            gameStateRef.current.projectiles = projectiles.filter((proj) => {
              proj.x += proj.vx;
              proj.life--;
              if (proj.life <= 0) return false;
              if (proj.x < 0 || proj.x > worldWidth) return false;

              let hit = false;
              enemies.forEach((enemy) => {
                if (enemy.hp <= 0 || hit) return;
                if (proj.x < enemy.x + enemy.width && proj.x + proj.width > enemy.x &&
                    proj.y < enemy.y + enemy.height && proj.y + proj.height > enemy.y) {
                  const isCrit = Math.random() * 100 < hero.critRate;
                  const dmg = Math.round(proj.damage * (isCrit ? 1.8 : 1.0));
                  enemy.hp -= dmg;
                  enemy.isHit = true; enemy.hitTimer = 10;
                  addFloatingText(enemy.x + enemy.width / 2, enemy.y - 10, `${dmg}${isCrit ? ' CRİT!' : ''}`, isCrit ? '#f59e0b' : hero.color);
                  addParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 8, hero.color);
                  sound.playHit();
                  gameStateRef.current.screenShake = 4;
                  hit = true;
                }
              });
              return !hit;
            });

            // Check Stage Clear: either every enemy is dead, OR the player
            // has fought their way to the cavern exit gate. See note above
            // the loop for why the exit gate exists.
            const aliveEnemies = enemies.filter(e => e.hp > 0);
            const reachedExit = player.x >= worldWidth - exitGateWidth;
            if ((aliveEnemies.length === 0 || reachedExit) && !stageCleared) {
              setStageCleared(true);
              onStageComplete(collectedCrystals + 100, 250);
            }
          }

          // RENDER
          const camX = gameStateRef.current.cameraX;
          const worldWidth = gameStateRef.current.worldWidth;
          const shake = gameStateRef.current.screenShake;
          ctx.save();
          if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            gameStateRef.current.screenShake *= 0.85;
          }

          // Clear
          ctx.fillStyle = '#0d1117'; ctx.fillRect(0, 0, 900, 450);

          // Draw Platforms
          platforms.forEach((p) => {
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - camX, p.y, p.width, p.height);
            ctx.strokeStyle = '#30363d'; ctx.strokeRect(p.x - camX, p.y, p.width, p.height);
          });

          // Draw exit gate (escape valve — reaching this also clears the stage)
          const exitX = worldWidth - exitGateWidth;
          ctx.fillStyle = 'rgba(63, 185, 80, 0.12)';
          ctx.fillRect(exitX - camX, 0, exitGateWidth, 450);
          ctx.strokeStyle = '#3fb950';
          ctx.setLineDash([6, 6]);
          ctx.strokeRect(exitX - camX, 0, exitGateWidth, 450);
          ctx.setLineDash([]);
          ctx.fillStyle = '#3fb950';
          ctx.font = 'bold 11px monospace';
          ctx.fillText('MAĞARA ÇIKIŞI ►', exitX - camX + 8, 24);

          // Draw Player — heroic swordsman sprite (drawHeroSprite), not a
          // flat rectangle. Mirrors automatically based on facing direction.
          const p = gameStateRef.current.player;
          const playerIsSwinging = p.isAttacking && hero.role !== 'Crystal Mage';
          drawHeroSprite(
            ctx,
            p.x - camX, p.y, p.width, p.height,
            p.facing, hero.color, hero.secondaryColor,
            playerIsSwinging
          );

          if (playerIsSwinging) {
            ctx.fillStyle = 'rgba(63, 185, 80, 0.35)';
            const slashX = p.facing === 'right' ? p.x - camX + p.width : p.x - camX - 50;
            ctx.fillRect(slashX, p.y, 50, p.height);
          }

          // Draw Enemies
          gameStateRef.current.enemies.forEach((enemy) => {
            if (enemy.hp <= 0) return;
            ctx.fillStyle = enemy.isHit ? '#ffffff' : enemy.color;
            ctx.fillRect(enemy.x - camX, enemy.y, enemy.width, enemy.height);

            // Enemy HP Bar
            ctx.fillStyle = '#21262d'; ctx.fillRect(enemy.x - camX, enemy.y - 10, enemy.width, 5);
            ctx.fillStyle = '#3fb950'; ctx.fillRect(enemy.x - camX, enemy.y - 10, (enemy.hp / enemy.hpMax) * enemy.width, 5);
          });

          // Draw Projectiles
          gameStateRef.current.projectiles.forEach((proj) => {
            ctx.fillStyle = hero.color;
            ctx.beginPath();
            ctx.arc(proj.x - camX, proj.y, proj.width / 2, 0, Math.PI * 2);
            ctx.fill();
          });

          // Draw Particles (and fade + remove expired ones — this array used
          // to grow forever because nothing ever filtered it out, which is
          // what eventually chokes the frame loop on longer sessions/boss
          // fights and makes the game look "frozen").
          gameStateRef.current.particles.forEach((pt) => {
            pt.x += pt.vx; pt.y += pt.vy; pt.life++;
            ctx.globalAlpha = Math.max(0, 1 - pt.life / pt.maxLife);
            ctx.fillStyle = pt.color;
            ctx.fillRect(pt.x - camX, pt.y, pt.size, pt.size);
          });
          ctx.globalAlpha = 1;
          gameStateRef.current.particles = gameStateRef.current.particles.filter(pt => pt.life < pt.maxLife);

          // Draw Floating Text
          gameStateRef.current.floatingTexts.forEach((ft, idx) => {
            ft.y -= 0.8; ft.life--;
            ctx.font = 'bold 12px monospace'; ctx.fillStyle = ft.color;
            ctx.fillText(ft.text, ft.x - camX, ft.y);
          });
          gameStateRef.current.floatingTexts = gameStateRef.current.floatingTexts.filter(t => t.life > 0);

          ctx.restore();
          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animId);
      }, [isPaused, isDead, stageCleared, hero, showIntro]);

      const p = gameStateRef.current.player;

      return (
        <div className="relative w-full max-w-5xl mx-auto rounded-xl overflow-hidden bento-card border border-[#30363d] shadow-2xl bg-[#161b22] font-mono">
          {/* Top HUD */}
          <div className="absolute top-0 inset-x-0 p-3 bg-gradient-to-b from-[#0d1117]/90 to-transparent z-20 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img src={hero.avatarUrl} alt={hero.name} className="w-10 h-10 rounded-lg border border-[#3fb950] object-cover" />
              <div>
                <div className="text-xs font-bold text-[#f0f6fc]">{hero.name} <span className="text-[#3fb950]">({hero.title})</span></div>
                <div className="w-32 h-2 bg-[#0d1117] rounded border border-[#30363d] overflow-hidden mt-1">
                  <div className="h-full bg-[#3fb950]" style={{ width: `${(p.hp / p.hpMax) * 100}%` }} />
                </div>
              </div>
            </div>

            <div className="flex flex-col items-center">
              <div className="text-[10px] text-[#8b949e]">SEVİYE {stage.levelNum}</div>
              <div className="text-xs font-bold text-white">{stage.name}</div>
            </div>

            <div className="flex items-center gap-4 text-xs">
              <div>💎 {collectedCrystals}</div>
              <button onClick={() => setIsPaused(!isPaused)} className="px-2.5 py-1 bg-[#21262d] border border-[#30363d] rounded text-[#f0f6fc]">
                {isPaused ? '▶ OYNAT' : '⏸ DURAKLAT'}
              </button>
              {/* Always-available emergency exit: no matter what state the
                  run is in, the player should never be stuck with no way
                  back to the map. */}
              <button onClick={onBackToMap} className="px-2.5 py-1 bg-[#21262d] border border-[#30363d] rounded text-[#f0f6fc]" title="Haritaya dön">
                🗺 Harita
              </button>
            </div>
          </div>

          {showIntro && (
            <div
              onClick={() => setShowIntro(false)}
              className="absolute inset-0 bg-[#0d1117]/95 backdrop-blur flex flex-col items-center justify-center p-6 text-center z-40 cursor-pointer"
            >
              <div className="text-[10px] tracking-[0.3em] text-[#8b949e] mb-2">SEVİYE {stage.levelNum}</div>
              <div className="text-2xl font-bold text-[#3fb950] mb-3">{stage.name}</div>
              <div className="text-xs text-[#8b949e] mb-1">{stage.threat} TEHDİT SEVİYESİ</div>
              {stage.bossName && (
                <div className="text-xs text-[#f85149] font-bold mt-2">⚠ BOSS: {stage.bossName}</div>
              )}
              <div className="text-[10px] text-[#8b949e] mt-4">Tüm düşmanları öldür ya da yeşil "MAĞARA ÇIKIŞI" bölgesine ulaş.</div>
              <div className="text-[10px] text-[#8b949e] mt-6 animate-pulse">devam etmek için tıkla</div>
            </div>
          )}

          <canvas ref={canvasRef} width={900} height={450} className="w-full h-auto bg-[#0d1117] block cursor-crosshair" />

          {/* Controls */}
          <div className="p-3 bg-[#161b22] border-t border-[#30363d] flex flex-wrap items-center justify-between gap-2">
            <div className="flex items-center gap-1.5">
              <button onMouseDown={() => mobileInputRef.current.left = true} onMouseUp={() => mobileInputRef.current.left = false} className="w-9 h-9 rounded bg-[#21262d] border border-[#30363d] text-white font-bold">◄</button>
              <button onMouseDown={() => mobileInputRef.current.jump = true} onMouseUp={() => mobileInputRef.current.jump = false} className="w-9 h-9 rounded bg-[#21262d] border border-[#30363d] text-white font-bold">▲</button>
              <button onMouseDown={() => mobileInputRef.current.right = true} onMouseUp={() => mobileInputRef.current.right = false} className="w-9 h-9 rounded bg-[#21262d] border border-[#30363d] text-white font-bold">►</button>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={triggerAttack} className="px-3 py-1.5 rounded bg-[#238636] border border-[#3fb950] text-white text-xs font-bold">⚔️ SALDIRI [J]</button>
              <button onClick={triggerSkill} className="px-3 py-1.5 rounded bg-[#38bdf8]/20 border border-[#38bdf8] text-[#38bdf8] text-xs font-bold">✨ SKILL [K]</button>
              <button onClick={triggerUltimate} className="px-3 py-1.5 rounded bg-[#a371f7]/20 border border-[#a371f7] text-[#a371f7] text-xs font-bold">💥 ULT [L]</button>
            </div>
          </div>

          {stageCleared && hasNextStage && (
            <div className="absolute inset-0 bg-[#0d1117]/90 backdrop-blur flex flex-col items-center justify-center p-6 text-center z-30 gap-3">
              <div className="text-xl text-[#3fb950] font-bold mb-1">SEVİYE TEMİZLENDİ!</div>
              <div className="text-xs text-[#8b949e] mb-2">+{collectedCrystals + 100} 💎 kazandın</div>
              <div className="flex items-center gap-3">
                <button onClick={initStage} className="px-5 py-2 bg-[#21262d] border border-[#30363d] text-white font-bold text-xs rounded">↻ YENİDEN OYNA</button>
                <button onClick={onNextStage} className="px-5 py-2 bg-[#238636] text-white font-bold text-xs rounded">SONRAKİ SEVİYE ►</button>
              </div>
            </div>
          )}

          {/* Distinct end-of-game screen: reaching this used to just quietly
              drop the player back on the map with no acknowledgement that
              they'd finished every stage in the cavern. */}
          {stageCleared && !hasNextStage && (
            <div className="absolute inset-0 bg-[#0d1117]/92 backdrop-blur flex flex-col items-center justify-center p-6 text-center z-30 gap-3">
              <div className="text-[10px] tracking-[0.3em] text-[#f0c419] mb-1">MAĞARA SERÜVENİ TAMAMLANDI</div>
              <div className="text-2xl text-[#f0c419] font-bold mb-1">🏆 TÜM MAĞARA FETHEDİLDİ!</div>
              <div className="text-xs text-[#8b949e] max-w-sm mb-1">
                {hero.name}, mağaradaki tüm katları ve {stage.bossName || 'son muhafızı'} temizledi. Bu kahramanla macera burada bitti — istersen bir seviyeyi tekrar oyna ya da başka bir kahramanla yeniden başla.
              </div>
              <div className="text-xs text-[#3fb950] font-bold mb-2">+{collectedCrystals + 100} 💎 kazandın</div>
              <div className="flex items-center gap-3">
                <button onClick={initStage} className="px-5 py-2 bg-[#21262d] border border-[#30363d] text-white font-bold text-xs rounded">↻ YENİDEN OYNA</button>
                <button onClick={onBackToMap} className="px-5 py-2 bg-[#238636] text-white font-bold text-xs rounded">🗺 HARİTAYA DÖN</button>
              </div>
            </div>
          )}

          {isDead && (
            <div className="absolute inset-0 bg-[#0d1117]/95 backdrop-blur flex flex-col items-center justify-center p-6 text-center z-30 gap-3">
              <div className="text-xl text-[#f85149] font-bold mb-1">MAĞARA YUTTU!</div>
              <div className="flex items-center gap-3">
                <button onClick={initStage} className="px-5 py-2 bg-[#da3633] text-white font-bold text-xs rounded">TEKRAR DENE</button>
                <button onClick={onBackToMap} className="px-5 py-2 bg-[#21262d] border border-[#30363d] text-white font-bold text-xs rounded">🗺 HARİTAYA DÖN</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // --- Main App Component ---
    function App() {
      const [currentView, setCurrentView] = useState('map');
      const [selectedHero, setSelectedHero] = useState(HEROES[0]);
      const [crystals, setCrystals] = useState(240);
      const [currentStageIndex, setCurrentStageIndex] = useState(0);
      // How many levels are unlocked, starting with just the first one.
      const [unlockedCount, setUnlockedCount] = useState(1);

      const startStage = (idx) => {
        setCurrentStageIndex(idx);
        setCurrentView('game');
      };

      const handleStageComplete = (crystalReward) => {
        setCrystals(prev => prev + crystalReward);
        setUnlockedCount(prev => Math.max(prev, currentStageIndex + 2));
      };

      const goToNextStage = () => {
        const nextIdx = currentStageIndex + 1;
        if (nextIdx < CAVERN_LEVELS.length) {
          setCurrentStageIndex(nextIdx);
        } else {
          setCurrentView('map');
        }
      };

      const hasNextStage = currentStageIndex < CAVERN_LEVELS.length - 1;

      return (
        <div className="min-h-screen bg-[#0d1117] text-[#c9d1d9] font-mono flex flex-col">
          {/* Header */}
          <header className="h-16 border-b border-[#30363d] bg-[#161b22] px-4 flex items-center justify-between">
            <div className="flex items-center gap-3">
              <div className="w-9 h-9 rounded-lg bg-[#238636] flex items-center justify-center font-bold text-white text-lg">O</div>
              <div>
                <div className="text-sm font-bold text-white">ODESSIA / ACTION ENGINE</div>
                <div className="text-[10px] text-[#8b949e]">Single HTML Standalone Engine</div>
              </div>
            </div>

            <div className="flex items-center gap-3 text-xs">
              <div className="text-[#3fb950] font-bold">💎 {crystals} CR</div>
              <button 
                onClick={() => setCurrentView('game')}
                className={`px-3 py-1 rounded ${currentView === 'game' ? 'bg-[#238636] text-white font-bold' : 'bg-[#21262d] text-[#8b949e]'}`}
              >
                Savaş Sahnesi
              </button>
              <button 
                onClick={() => setCurrentView('map')}
                className={`px-3 py-1 rounded ${currentView === 'map' ? 'bg-[#238636] text-white font-bold' : 'bg-[#21262d] text-[#8b949e]'}`}
              >
                Harita
              </button>
            </div>
          </header>

          {/* Main Area */}
          <main className="p-4 max-w-5xl mx-auto w-full flex-1 space-y-4">
            {/* Hero Selection Selector Bar */}
            <div className="bento-card p-3 flex flex-wrap items-center justify-between gap-3">
              <div className="flex items-center gap-2">
                <span className="text-xs text-[#8b949e]">KAHRAMAN:</span>
                <div className="flex gap-2">
                  {HEROES.map((h) => (
                    <button
                      key={h.id}
                      onClick={() => setSelectedHero(h)}
                      className={`px-2.5 py-1 rounded text-xs font-bold transition-all ${selectedHero.id === h.id ? 'bg-[#238636] text-white border border-[#3fb950]' : 'bg-[#21262d] text-[#8b949e] border border-[#30363d]'}`}
                    >
                      {h.name}
                    </button>
                  ))}
                </div>
              </div>
              <div className="text-xs text-[#8b949e]">
                SINIF: <span className="text-[#3fb950] font-bold">{selectedHero.role}</span>
              </div>
            </div>

            {currentView === 'game' && (
              <PlayableGameCanvas
                key={CAVERN_LEVELS[currentStageIndex].id}
                hero={selectedHero}
                stage={CAVERN_LEVELS[currentStageIndex]}
                onStageComplete={handleStageComplete}
                onGameOver={() => {}}
                onNextStage={goToNextStage}
                hasNextStage={hasNextStage}
                onBackToMap={() => setCurrentView('map')}
              />
            )}

            {currentView === 'map' && (
              <div className="bento-card p-6 space-y-4">
                <h2 className="text-lg font-bold text-white">MAĞARA DIORAMA HARİTASI</h2>
                <div className="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                  {CAVERN_LEVELS.map((lvl, idx) => {
                    const isLocked = idx >= unlockedCount;
                    return (
                      <button
                        key={lvl.id}
                        disabled={isLocked}
                        onClick={() => !isLocked && startStage(idx)}
                        className={`text-left p-4 bg-[#0d1117] border rounded-lg space-y-1 transition-all ${
                          isLocked
                            ? 'border-[#30363d] opacity-40 cursor-not-allowed'
                            : 'border-[#30363d] hover:border-[#3fb950] cursor-pointer'
                        }`}
                      >
                        <div className="text-xs text-[#3fb950] font-bold flex items-center justify-between">
                          <span>SEVİYE {lvl.levelNum}</span>
                          {isLocked && <span className="text-[#8b949e]">🔒</span>}
                        </div>
                        <div className="text-sm font-bold text-white">{lvl.name}</div>
                        <div className="text-[10px] text-[#8b949e]">{lvl.threat} TEHDİT SEVİYESİ</div>
                        {!isLocked && (
                          <div className="text-[10px] text-[#3fb950] font-bold pt-1">▶ OYNA</div>
                        )}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </main>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
