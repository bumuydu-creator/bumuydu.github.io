      { id: 's6', name: '6. Kraliyet Mahzeni', levelNum: 6, threat: 'ÖLÜMCÜL', enemyTypes: ['skeleton', 'flying_eye'], bossName: 'Kemik Kralı (Malakar)', bossType: 'boss_skeleton', environmentType: 'crystal', crystalReward: 500, description: 'Kadim Kemik Kralı Malakar tahtında uyanıyor!' }
    ];

    const INITIAL_RELICS = [
      { id: 'relic_blade', name: 'Obsidyen Biley Taşı', cost: 150, description: 'Saldırı gücünü +8 artırır.', bonusType: 'attack', bonusValue: 8, purchased: false },
      { id: 'relic_heart', name: 'Yeraltı Ejder Kalbi', cost: 180, description: 'Maksimum Canı (HP) +35 artırır.', bonusType: 'hp', bonusValue: 35, purchased: false },
      { id: 'relic_mana', name: 'Safir Mana Prizması', cost: 140, description: 'Maksimum Manayı +40 artırır.', bonusType: 'mana', bonusValue: 40, purchased: false },
      { id: 'relic_boots', name: 'Rüzgar Çizmeleri', cost: 160, description: 'Hareket hızını +1.2 artırır.', bonusType: 'speed', bonusValue: 1.2, purchased: false },
      { id: 'relic_eye', name: 'Avcı Gözü', cost: 200, description: 'Kritik Vuruş Şansını +15% artırır.', bonusType: 'crit', bonusValue: 15, purchased: false }
    ];

    // ==========================================
    // 6. MAIN PLAYABLE GAME CANVAS
    // ==========================================
    function PlayableGameCanvas({ hero, stage, attackBonus, hpBonus, manaBonus, speedBonus, critBonus, onStageComplete, onGameOver, onNextStage, hasNextStage, onBackToMap }) {
      const canvasRef = useRef(null);
      const [isPaused, setIsPaused] = useState(false);
      const [stageCleared, setStageCleared] = useState(false);
      const [isDead, setIsDead] = useState(false);
      const [collectedCrystals, setCollectedCrystals] = useState(0);
      const [showIntro, setShowIntro] = useState(true);

      const keysRef = useRef({});
      const mobileInputRef = useRef({ left: false, right: false, jump: false });

      const effectiveHpMax = hero.hpMax + hpBonus;
      const effectiveManaMax = hero.manaMax + manaBonus;
      const effectiveAttack = hero.attackPower + attackBonus;
      const effectiveSpeed = hero.speed + speedBonus;
      const effectiveCrit = hero.critRate + critBonus;

      const gameStateRef = useRef({
        player: {
          x: 100, y: 300, vx: 0, vy: 0, width: 42, height: 56,
          hp: effectiveHpMax, hpMax: effectiveHpMax, mana: effectiveManaMax, manaMax: effectiveManaMax,
          isGrounded: false, facing: 'right', isAttacking: false, attackTimer: 0,
          skillCooldown: 0, ultCooldown: 0, animFrame: 0, animTimer: 0, currentAnim: 'idle',
          isDashing: false, dashTimer: 0, comboCount: 0, comboTimer: 0, invulnerableTimer: 0
        },
        enemies: [], projectiles: [], particles: [], floatingTexts: [], droppedCrystals: [],
        cameraX: 0, worldWidth: 2600, screenShake: 0
      });

      const addFloatingText = (x, y, text, color = '#f59e0b') => {
        gameStateRef.current.floatingTexts.push({
          id: Math.random().toString(),
          x: x + (Math.random() * 24 - 12), y: y + (Math.random() * 10 - 5),
          text, color, life: 45
        });
      };

      const addParticles = (x, y, count, color) => {
        for (let i = 0; i < count; i++) {
          const angle = Math.random() * Math.PI * 2;
          const speed = Math.random() * 5 + 1;
          gameStateRef.current.particles.push({
            x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            size: Math.random() * 4 + 2, color, life: 0, maxLife: Math.random() * 20 + 15
          });
        }
      };

      const initStage = useCallback(() => {
        const worldW = 2600;
        const enemies = [];
        const availableTypes = stage.enemyTypes;
        const count = 12 + stage.levelNum * 2;

        for (let i = 0; i < count; i++) {
          const type = availableTypes[i % availableTypes.length];
          const def = MONSTER_DATABASE.find(m => m.type === type) || MONSTER_DATABASE[0];
          const x = 420 + i * 140 + Math.random() * 40;
          enemies.push({
            id: `mob_${i}`, type, name: def.name,
            x, y: def.isFlying ? 220 + Math.random() * 80 : 340,
            vx: 0, vy: 0, width: def.width, height: def.height,
            hp: def.baseHp + stage.levelNum * 5, hpMax: def.baseHp + stage.levelNum * 5,
            color: def.color, speed: def.baseSpeed, facing: 'left',
            attackCooldown: Math.floor(Math.random() * 40), isHit: false, hitTimer: 0,
            animState: 'idle', animFrame: 0, animTimer: 0, isDead: false, deathTimer: 0,
            isFlying: def.isFlying
          });
        }

        if (stage.bossName && stage.bossType) {
          const bossDef = MONSTER_DATABASE.find(m => m.type === stage.bossType) || MONSTER_DATABASE[4];
          enemies.push({
            id: 'boss_entity', type: stage.bossType, name: stage.bossName,
            x: worldW - 400, y: bossDef.isFlying ? 200 : 310,
            vx: 0, vy: 0, width: bossDef.width, height: bossDef.height,
            hp: bossDef.baseHp, hpMax: bossDef.baseHp, color: bossDef.color,
            speed: bossDef.baseSpeed, facing: 'left', attackCooldown: 30,
            isHit: false, hitTimer: 0, animState: 'idle', animFrame: 0, animTimer: 0,
            isDead: false, deathTimer: 0, isBoss: true, isFlying: bossDef.isFlying
          });
        }

        gameStateRef.current = {
          player: {
            x: 100, y: 300, vx: 0, vy: 0, width: 42, height: 56,
            hp: effectiveHpMax, hpMax: effectiveHpMax, mana: effectiveManaMax, manaMax: effectiveManaMax,
            isGrounded: false, facing: 'right', isAttacking: false, attackTimer: 0,
            skillCooldown: 0, ultCooldown: 0, animFrame: 0, animTimer: 0, currentAnim: 'idle',
            isDashing: false, dashTimer: 0, comboCount: 0, comboTimer: 0, invulnerableTimer: 0
          },
          enemies, projectiles: [], particles: [], floatingTexts: [], droppedCrystals: [],
          cameraX: 0, worldWidth: worldW, screenShake: 0
        };

        setIsDead(false); setStageCleared(false); setCollectedCrystals(0);
      }, [stage, effectiveHpMax, effectiveManaMax]);

      useEffect(() => {
        initStage();
        setShowIntro(true);
        const t = setTimeout(() => setShowIntro(false), 2400);
        return () => clearTimeout(t);
      }, [initStage]);

      useEffect(() => {
        const handleKeyDown = (e) => {
          keysRef.current[e.key.toLowerCase()] = true;
          if ([' ', 'ArrowUp', 'w', 'W'].includes(e.key)) e.preventDefault();
        };
        const handleKeyUp = (e) => { keysRef.current[e.key.toLowerCase()] = false; };
        window.addEventListener('keydown', handleKeyDown);
        window.addEventListener('keyup', handleKeyUp);
        return () => {
          window.removeEventListener('keydown', handleKeyDown);
          window.removeEventListener('keyup', handleKeyUp);
        };
      }, []);

      const triggerAttack = () => {
        const { player, enemies, projectiles } = gameStateRef.current;
        if (player.attackTimer > 0) return;
        player.attackTimer = 16;
        player.isAttacking = true;

        if (hero.role === 'Crystal Mage') {
          sound.playSpell();
          const dir = player.facing === 'right' ? 1 : -1;
          projectiles.push({
            id: Math.random().toString(), x: player.x + player.width / 2, y: player.y + player.height / 2,
            vx: 12 * dir, vy: 0, width: 16, height: 16, damage: effectiveAttack, life: 80, isEnemy: false, color: '#38bdf8'
          });
          return;
        }

        sound.playSlash();
        const reach = hero.role === 'Blade Dancer' ? 75 : 60;
        const attackX = player.facing === 'right' ? player.x + player.width : player.x - reach;
        const attackBox = { x: attackX, y: player.y - 15, w: reach, h: player.height + 30 };

        let hitAny = false;
        enemies.forEach((enemy) => {
          if (enemy.hp <= 0) return;
          if (attackBox.x < enemy.x + enemy.width && attackBox.x + attackBox.w > enemy.x &&
              attackBox.y < enemy.y + enemy.height && attackBox.y + attackBox.h > enemy.y) {
            
            if (enemy.type === 'skeleton' && Math.random() < 0.35) {
              enemy.animState = 'special';
              sound.playShieldBlock();
              addFloatingText(enemy.x + enemy.width / 2, enemy.y - 12, '🛡️ BLOK!', '#94a3b8');
              return;
            }

            const isCrit = Math.random() * 100 < effectiveCrit;
            const dmg = Math.round(effectiveAttack * (isCrit ? 1.85 : 1.0));
            enemy.hp -= dmg;
            enemy.isHit = true; enemy.hitTimer = 12; enemy.animState = 'hit';
            enemy.vx = player.facing === 'right' ? 6 : -6;

            addFloatingText(enemy.x + enemy.width / 2, enemy.y - 15, `${dmg}${isCrit ? ' CRİT!' : ''}`, isCrit ? '#f59e0b' : '#34d399');
            addParticles(enemy.x + enemy.width / 2, enemy.y + enemy.height / 2, 10, hero.color);
            sound.playMonsterHit();
            hitAny = true;

            if (enemy.hp <= 0) {
              enemy.isDead = true; enemy.animState = 'death';
              sound.playMonsterDeath();
              gameStateRef.current.droppedCrystals.push({
                id: Math.random().toString(), x: enemy.x + enemy.width / 2, y: enemy.y + enemy.height / 2,
                vy: -4, value: enemy.isBoss ? 50 : 15, color: '#34d399', life: 240
              });
            }
          }
        });
        if (hitAny) gameStateRef.current.screenShake = 6;
      };

      const triggerSkill = () => {
        const { player, enemies, projectiles } = gameStateRef.current;
        if (player.skillCooldown > 0 || player.mana < 20) return;
        player.mana -= 20;
        player.skillCooldown = hero.skillCooldownSec * 60;
        sound.playSpell();

        player.isDashing = true; player.dashTimer = 14;
        player.vx = player.facing === 'right' ? 20 : -20;
        addParticles(player.x, player.y + player.height / 2, 16, hero.color);
        addFloatingText(player.x, player.y - 20, `${hero.skillName}!`, hero.color);

        enemies.forEach((enemy) => {
          if (enemy.hp <= 0) return;
          if (Math.abs(enemy.x - player.x) < 180 && Math.abs(enemy.y - player.y) < 60) {
            const dmg = Math.round(effectiveAttack * 1.6);
            enemy.hp -= dmg; enemy.isHit = true; enemy.hitTimer = 14; enemy.animState = 'hit';
            addFloatingText(enemy.x, enemy.y - 12, `${dmg} GÜÇLÜ!`, '#38bdf8');
            sound.playMonsterHit();
          }
        });
      };

      const triggerUltimate = () => {
        const { player, enemies } = gameStateRef.current;
        if (player.ultCooldown > 0 || player.mana < 50) return;
        player.mana -= 50; player.ultCooldown = 540;
        sound.playExplosion();
        gameStateRef.current.screenShake = 18;
        addFloatingText(player.x, player.y - 35, `★ ${hero.ultimateName} ★`, '#f59e0b');

        enemies.forEach((enemy) => {
          if (enemy.hp <= 0) return;
          if (Math.hypot(enemy.x - player.x, enemy.y - player.y) < 420) {
            const dmg = Math.round(effectiveAttack * 3.2);
            enemy.hp -= dmg; enemy.isHit = true; enemy.hitTimer = 22; enemy.animState = 'hit';
            addFloatingText(enemy.x, enemy.y - 20, `${dmg} KASIRGA!`, '#f59e0b');
            if (enemy.hp <= 0) {
              enemy.isDead = true; enemy.animState = 'death';
              sound.playMonsterDeath();
              gameStateRef.current.droppedCrystals.push({
                id: Math.random().toString(), x: enemy.x, y: enemy.y, vy: -5,
                value: enemy.isBoss ? 60 : 20, color: '#f59e0b', life: 240
              });
            }
          }
        });
      };

      useEffect(() => {
        let animId;
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');

        const platforms = [
          { x: 0, y: 400, width: 2600, height: 100 },
          { x: 280, y: 280, width: 190, height: 22 },
          { x: 580, y: 210, width: 230, height: 22 },
          { x: 920, y: 290, width: 180, height: 22 },
          { x: 1220, y: 200, width: 240, height: 22 },
          { x: 1560, y: 270, width: 210, height: 22 },
          { x: 1900, y: 220, width: 250, height: 22 },
          { x: 2220, y: 280, width: 200, height: 22 }
        ];

        const loop = () => {
          if (!isPaused && !isDead && !stageCleared && !showIntro) {
            const { player, enemies, projectiles, particles, floatingTexts, droppedCrystals, worldWidth } = gameStateRef.current;

            const left = keysRef.current['a'] || keysRef.current['arrowleft'] || mobileInputRef.current.left;
            const right = keysRef.current['d'] || keysRef.current['arrowright'] || mobileInputRef.current.right;
            const jump = keysRef.current['w'] || keysRef.current[' '] || keysRef.current['arrowup'] || mobileInputRef.current.jump;

            if (keysRef.current['j'] || keysRef.current['z']) triggerAttack();
            if (keysRef.current['k'] || keysRef.current['x']) triggerSkill();
            if (keysRef.current['l'] || keysRef.current['c']) triggerUltimate();

            if (!player.isDashing) {
              if (left) { player.vx = -effectiveSpeed; player.facing = 'left'; }
              else if (right) { player.vx = effectiveSpeed; player.facing = 'right'; }
              else player.vx *= 0.72;
            } else {
              player.dashTimer--;
              if (player.dashTimer <= 0) player.isDashing = false;
            }

            if (jump && player.isGrounded) {
              player.vy = -13.5; player.isGrounded = false; sound.playJump();
            }

            player.vy += 0.65;
            player.x += player.vx; player.y += player.vy;
            player.x = Math.max(0, Math.min(player.x, worldWidth - player.width));

            player.isGrounded = false;
            platforms.forEach((p) => {
              if (player.x + player.width > p.x && player.x < p.x + p.width &&
                  player.y + player.height >= p.y && player.y + player.height <= p.y + p.height + player.vy + 3 && player.vy >= 0) {
                player.y = p.y - player.height; player.vy = 0; player.isGrounded = true;
              }
            });

            if (player.attackTimer > 6) player.currentAnim = 'attack';
            else if (!player.isGrounded) player.currentAnim = player.vy < 0 ? 'jump' : 'fall';
            else if (Math.abs(player.vx) > 0.6) player.currentAnim = 'run';
            else player.currentAnim = 'idle';

            player.animTimer++;
            if (player.animTimer > 5) { player.animTimer = 0; player.animFrame++; }

            gameStateRef.current.cameraX = Math.max(0, Math.min(player.x - 380, worldWidth - 900));

            player.mana = Math.min(effectiveManaMax, player.mana + 0.12);
            if (player.attackTimer > 0) player.attackTimer--;
            if (player.skillCooldown > 0) player.skillCooldown--;
            if (player.ultCooldown > 0) player.ultCooldown--;
            if (player.invulnerableTimer > 0) player.invulnerableTimer--;

            enemies.forEach((enemy) => {
              if (enemy.hp <= 0) { enemy.deathTimer++; return; }
              if (enemy.hitTimer > 0) { enemy.hitTimer--; if (enemy.hitTimer === 0) enemy.isHit = false; }
              enemy.animTimer++;
              if (enemy.animTimer > 6) { enemy.animTimer = 0; enemy.animFrame++; }

              const dist = Math.abs(player.x - enemy.x);
              if (enemy.isFlying) {
                if (dist < 450) {
                  enemy.facing = player.x > enemy.x ? 'right' : 'left';
                  enemy.vx = enemy.facing === 'right' ? enemy.speed : -enemy.speed;
                  enemy.animState = 'walk';
                  if (enemy.attackCooldown <= 0 && dist < 300) {
                    enemy.attackCooldown = 80; enemy.animState = 'attack'; sound.playSpell();
                    projectiles.push({
                      id: Math.random().toString(), x: enemy.x + enemy.width / 2, y: enemy.y + enemy.height / 2,
                      vx: (enemy.facing === 'right' ? 7 : -7), vy: (player.y - enemy.y) * 0.02,
                      width: 14, height: 14, damage: 16, life: 70, isEnemy: true, color: '#ef4444'
                    });
                  }
                }
              } else {
                if (dist < 380 && Math.abs(player.y - enemy.y) < 120) {
                  enemy.facing = player.x > enemy.x ? 'right' : 'left';
                  enemy.vx = enemy.facing === 'right' ? enemy.speed : -enemy.speed;
                  enemy.animState = 'walk';
                  if (dist < (enemy.isBoss ? 70 : 45) && enemy.attackCooldown <= 0) {
                    enemy.animState = 'attack'; enemy.attackCooldown = 55;
                    if (player.invulnerableTimer <= 0) {
                      const monsterDmg = enemy.isBoss ? 24 : 14;
                      player.hp -= monsterDmg; player.invulnerableTimer = 35;
                      addFloatingText(player.x, player.y - 15, `-${monsterDmg}`, '#ef4444');
                      sound.playHit();
                      if (player.hp <= 0) { setIsDead(true); onGameOver(); }
                    }
                  }
                } else {
                  enemy.vx = 0; if (enemy.animState !== 'hit') enemy.animState = 'idle';
                }
              }
              enemy.x += enemy.vx;
              if (enemy.attackCooldown > 0) enemy.attackCooldown--;
            });

            // Projectiles
            gameStateRef.current.projectiles = projectiles.filter((proj) => {
              proj.x += proj.vx; proj.y += proj.vy; proj.life--;
              if (proj.life <= 0 || proj.x < 0 || proj.x > worldWidth) return false;
              if (proj.isEnemy) {
                if (player.invulnerableTimer <= 0 && proj.x < player.x + player.width && proj.x + proj.width > player.x &&
                    proj.y < player.y + player.height && proj.y + proj.height > player.y) {
                  player.hp -= proj.damage; player.invulnerableTimer = 30;
                  addFloatingText(player.x, player.y - 12, `-${proj.damage}`, '#ef4444');
                  sound.playHit();
                  if (player.hp <= 0) { setIsDead(true); onGameOver(); }
                  return false;
                }
              } else {
                let hit = false;
                enemies.forEach((enemy) => {
                  if (enemy.hp <= 0 || hit) return;
                  if (proj.x < enemy.x + enemy.width && proj.x + proj.width > enemy.x &&
                      proj.y < enemy.y + enemy.height && proj.y + proj.height > enemy.y) {
                    const dmg = Math.round(proj.damage);
                    enemy.hp -= dmg; enemy.isHit = true; enemy.hitTimer = 10; enemy.animState = 'hit';
                    addFloatingText(enemy.x + enemy.width / 2, enemy.y - 12, `${dmg}`, '#38bdf8');
                    sound.playMonsterHit();
                    hit = true;
                    if (enemy.hp <= 0) {
                      enemy.isDead = true; enemy.animState = 'death'; sound.playMonsterDeath();
                      gameStateRef.current.droppedCrystals.push({
                        id: Math.random().toString(), x: enemy.x, y: enemy.y, vy: -4,
                        value: enemy.isBoss ? 50 : 15, color: '#38bdf8', life: 240
                      });
                    }
                  }
                });
                return !hit;
              }
              return true;
            });

            // Crystals Pickup
            gameStateRef.current.droppedCrystals = droppedCrystals.filter((c) => {
              c.y += c.vy; c.vy += 0.2; if (c.y > 390) c.y = 390;
              c.life--;
              if (c.life <= 0) return false;
              if (Math.hypot(c.x - (player.x + player.width / 2), c.y - (player.y + player.height / 2)) < 45) {
                setCollectedCrystals(prev => prev + c.value);
                sound.playPickup();
                addFloatingText(player.x, player.y - 10, `+${c.value} 💎`, '#34d399');
                return false;
              }
              return true;
            });

            // Check Stage Clear
            const alive = enemies.filter(e => e.hp > 0);
            const reachedExit = player.x >= worldWidth - 160;
            if ((alive.length === 0 || reachedExit) && !stageCleared) {
              setStageCleared(true);
              sound.playVictory();
              onStageComplete(collectedCrystals + stage.crystalReward, 250);
            }
          }

          // RENDER
          const camX = gameStateRef.current.cameraX;
          const shake = gameStateRef.current.screenShake;
          ctx.save();
          if (shake > 0) {
            ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);
            gameStateRef.current.screenShake *= 0.84;
          }

          drawEnvironment(ctx, camX, 900, 450, stage.environmentType);
          platforms.forEach((p) => drawRockPlatform(ctx, p.x - camX, p.y, p.width, p.height, stage.environmentType));

          // Exit Gate
          const exitX = gameStateRef.current.worldWidth - 160;
          ctx.fillStyle = 'rgba(52, 211, 153, 0.15)'; ctx.fillRect(exitX - camX, 0, 160, 450);
          ctx.strokeStyle = '#34d399'; ctx.setLineDash([8, 6]); ctx.strokeRect(exitX - camX, 0, 160, 450); ctx.setLineDash([]);
          ctx.fillStyle = '#34d399'; ctx.font = 'bold 12px monospace'; ctx.fillText('MAĞARA ÇIKIŞI ►', exitX - camX + 12, 28);

          // Crystals
          gameStateRef.current.droppedCrystals.forEach((c) => {
            ctx.fillStyle = c.color;
            ctx.beginPath(); ctx.moveTo(c.x - camX, c.y - 7); ctx.lineTo(c.x - camX + 6, c.y); ctx.lineTo(c.x - camX, c.y + 7); ctx.lineTo(c.x - camX - 6, c.y); ctx.closePath(); ctx.fill();
          });

          // Enemies
          gameStateRef.current.enemies.forEach((enemy) => {
            if (enemy.isDead && enemy.deathTimer > 45) return;
            drawEnemyMonster(ctx, enemy.type, enemy.x - camX, enemy.y, enemy.width, enemy.height, enemy.facing, enemy.animFrame, enemy.animState, enemy.isHit);
            if (enemy.hp > 0) {
              const barW = Math.max(enemy.width, 36);
              const barX = enemy.x - camX + (enemy.width - barW) / 2;
              ctx.fillStyle = '#0f172a'; ctx.fillRect(barX - 1, enemy.y - 13, barW + 2, 6);
              ctx.fillStyle = enemy.isBoss ? '#ef4444' : '#22c55e'; ctx.fillRect(barX, enemy.y - 12, (enemy.hp / enemy.hpMax) * barW, 4);
            }
          });

          // Player
          const p = gameStateRef.current.player;
          drawHeroSprite(ctx, p.x - camX, p.y, p.width, p.height, p.facing, hero.color, hero.secondaryColor, hero.role, p.isAttacking, p.isDashing, p.currentAnim, p.animFrame, p.invulnerableTimer);

          // Projectiles
          gameStateRef.current.projectiles.forEach((proj) => {
            ctx.fillStyle = proj.color; ctx.beginPath(); ctx.arc(proj.x - camX, proj.y, proj.width / 2, 0, Math.PI * 2); ctx.fill();
          });

          // Floating Text
          gameStateRef.current.floatingTexts.forEach((ft) => {
            ft.y -= 0.75; ft.life--;
            ctx.font = 'bold 12px monospace'; ctx.fillStyle = ft.color; ctx.fillText(ft.text, ft.x - camX, ft.y);
          });
          gameStateRef.current.floatingTexts = gameStateRef.current.floatingTexts.filter(t => t.life > 0);

          ctx.restore();
          animId = requestAnimationFrame(loop);
        };

        animId = requestAnimationFrame(loop);
        return () => cancelAnimationFrame(animId);
      }, [isPaused, isDead, stageCleared, showIntro, hero, stage, effectiveAttack, effectiveSpeed]);

      const p = gameStateRef.current.player;

      return (
        <div className="relative w-full max-w-5xl mx-auto rounded-2xl overflow-hidden border border-[#30363d] shadow-2xl bg-[#161b22] font-mono">
          {/* Top HUD */}
          <div className="p-3 bg-[#0d1117]/95 border-b border-[#30363d] flex items-center justify-between">
            <div className="flex items-center gap-3">
              <img src={hero.avatarUrl} alt={hero.name} className="w-11 h-11 rounded-xl border-2 object-cover" style={{ borderColor: hero.color }} />
              <div>
                <div className="text-xs font-bold text-white flex items-center gap-2">
                  <span>{hero.name}</span>
                  <span className="text-[10px] px-1.5 py-0.5 rounded bg-[#21262d] text-emerald-400">{hero.title}</span>
                </div>
                <div className="w-36 h-2 bg-[#1e293b] rounded-full overflow-hidden mt-1 border border-[#334155]">
                  <div className="h-full bg-emerald-500 transition-all duration-150" style={{ width: `${Math.max(0, (p.hp / p.hpMax) * 100)}%` }} />
                </div>
                <div className="w-28 h-1.5 bg-[#1e293b] rounded-full overflow-hidden mt-0.5 border border-[#334155]">
                  <div className="h-full bg-cyan-400 transition-all duration-150" style={{ width: `${Math.max(0, (p.mana / p.manaMax) * 100)}%` }} />
                </div>
              </div>
            </div>

            <div className="text-center hidden sm:block">
              <div className="text-[10px] text-slate-400 uppercase">KAT {stage.levelNum} / 6</div>
              <div className="text-xs font-bold text-white">{stage.name}</div>
            </div>

            <div className="flex items-center gap-3 text-xs">
              <div className="px-2.5 py-1 rounded-lg bg-emerald-950/60 border border-emerald-500/40 text-emerald-400 font-bold">
                💎 {collectedCrystals}
              </div>
              <button onClick={() => setIsPaused(!isPaused)} className="px-2.5 py-1.5 bg-[#21262d] border border-[#30363d] rounded-lg text-white font-bold text-xs">
                {isPaused ? '▶ Oynat' : '⏸ Duraklat'}
              </button>
              <button onClick={onBackToMap} className="px-2.5 py-1.5 bg-[#21262d] border border-[#30363d] rounded-lg text-slate-300 hover:text-white text-xs">
                🗺 Harita
              </button>
            </div>
          </div>

          {showIntro && (
            <div onClick={() => setShowIntro(false)} className="absolute inset-0 bg-[#0d1117]/95 backdrop-blur flex flex-col items-center justify-center p-6 text-center z-40 cursor-pointer">
              <div className="text-xs tracking-[0.3em] text-emerald-400 font-bold mb-2">SEVİYE {stage.levelNum}</div>
              <div className="text-2xl font-bold text-white mb-2">{stage.name}</div>
              <p className="text-xs text-slate-400 max-w-md mb-4">{stage.description}</p>
              {stage.bossName && (
                <div className="text-xs text-rose-400 font-bold px-3 py-1 bg-rose-950/40 border border-rose-500/40 rounded-lg">
                  ⚠️ DİKKAT BOSS: {stage.bossName}
                </div>
              )}
              <div className="text-[11px] text-slate-500 mt-6 animate-pulse">Devam etmek için tıkla</div>
            </div>
          )}

          <canvas ref={canvasRef} width={900} height={450} className="w-full h-auto bg-[#0b0f19] block cursor-crosshair" />

          {/* Controls Bar */}
          <div className="p-3 bg-[#161b22] border-t border-[#30363d] flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-1.5">
              <button onMouseDown={() => mobileInputRef.current.left = true} onMouseUp={() => mobileInputRef.current.left = false} className="w-10 h-10 rounded-xl bg-[#21262d] border border-[#30363d] text-white font-bold">◄</button>
              <button onMouseDown={() => mobileInputRef.current.jump = true} onMouseUp={() => mobileInputRef.current.jump = false} className="w-10 h-10 rounded-xl bg-[#21262d] border border-[#30363d] text-white font-bold">▲</button>
              <button onMouseDown={() => mobileInputRef.current.right = true} onMouseUp={() => mobileInputRef.current.right = false} className="w-10 h-10 rounded-xl bg-[#21262d] border border-[#30363d] text-white font-bold">►</button>
            </div>
            <div className="flex items-center gap-2">
              <button onClick={triggerAttack} className="px-4 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold shadow-lg">⚔️ SALDIRI [J]</button>
              <button onClick={triggerSkill} className="px-3.5 py-2 rounded-xl bg-cyan-950/60 border border-cyan-400 text-cyan-300 text-xs font-bold">✨ {hero.skillName} [K]</button>
              <button onClick={triggerUltimate} className="px-3.5 py-2 rounded-xl bg-purple-950/60 border border-purple-400 text-purple-300 text-xs font-bold">💥 ULT [L]</button>
            </div>
          </div>

          {stageCleared && (
            <div className="absolute inset-0 bg-[#0d1117]/92 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-30 space-y-4">
              <div className="text-2xl font-bold text-white">🏆 MAĞARA KATINI TEMİZLEDİN!</div>
              <div className="text-emerald-400 font-bold text-xs">+{collectedCrystals + stage.crystalReward} 💎 Kristal Kazandın</div>
              <div className="flex items-center gap-3">
                <button onClick={initStage} className="px-4 py-2 bg-[#21262d] border border-[#30363d] text-white font-bold text-xs rounded-xl">↻ Yeniden Oyna</button>
                {hasNextStage ? (
                  <button onClick={onNextStage} className="px-5 py-2 bg-emerald-600 text-white font-bold text-xs rounded-xl shadow-lg">Sonraki Seviye ►</button>
                ) : (
                  <button onClick={onBackToMap} className="px-5 py-2 bg-amber-600 text-white font-bold text-xs rounded-xl shadow-lg">Tüm Mağara Fethedildi! 🗺</button>
                )}
              </div>
            </div>
          )}

          {isDead && (
            <div className="absolute inset-0 bg-[#0d1117]/95 backdrop-blur-md flex flex-col items-center justify-center p-6 text-center z-30 space-y-4">
              <div className="text-2xl font-bold text-rose-400">💀 MAĞARA CANAVARLARI YUTTU!</div>
              <div className="flex items-center gap-3">
                <button onClick={initStage} className="px-5 py-2 bg-rose-600 text-white font-bold text-xs rounded-xl">↻ Tekrar Dene</button>
                <button onClick={onBackToMap} className="px-4 py-2 bg-[#21262d] border border-[#30363d] text-white font-bold text-xs rounded-xl">🗺 Harita</button>
              </div>
            </div>
          )}
        </div>
      );
    }

    // ==========================================
    // 7. BESTIARY & CODEX MODAL
    // ==========================================
    function BestiaryModal({ onClose }) {
      const [selectedMonster, setSelectedMonster] = useState(MONSTER_DATABASE[0]);
      const [animState, setAnimState] = useState('idle');
      const previewCanvasRef = useRef(null);

      useEffect(() => {
        let frame = 0; let animId;
        const render = () => {
          const canvas = previewCanvasRef.current;
          if (canvas) {
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#0f172a'; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.strokeStyle = '#334155'; ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(20, 160); ctx.lineTo(240, 160); ctx.stroke();
            drawEnemyMonster(ctx, selectedMonster.type, 130 - selectedMonster.width / 2, 160 - selectedMonster.height, selectedMonster.width, selectedMonster.height, 'right', frame, animState, animState === 'hit');
          }
          frame++; animId = requestAnimationFrame(render);
        };
        animId = requestAnimationFrame(render);
        return () => cancelAnimationFrame(animId);
      }, [selectedMonster, animState]);

      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#161b22] border border-[#30363d] rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col overflow-hidden shadow-2xl font-mono">
            <div className="p-4 border-b border-[#30363d] flex items-center justify-between bg-[#0d1117]">
              <div>
                <h2 className="text-base font-bold text-white">📖 CANAVAR KODEXİ VE ANİMASYONLAR</h2>
                <p className="text-xs text-slate-400">İskelet, Goblin, Mantar ve Uçan Göz Özellikleri</p>
              </div>
              <button onClick={onClose} className="px-3 py-1 bg-[#21262d] rounded-lg text-slate-300">✕</button>
            </div>

            <div className="p-4 grid grid-cols-1 md:grid-cols-12 gap-4 overflow-y-auto">
              <div className="md:col-span-5 space-y-1.5">
                {MONSTER_DATABASE.map((m) => (
                  <button
                    key={m.type}
                    onClick={() => { setSelectedMonster(m); sound.playMonsterHit(); }}
                    className={`w-full text-left p-3 rounded-xl border flex items-center justify-between ${selectedMonster.type === m.type ? 'bg-emerald-950/40 border-emerald-500 text-white' : 'bg-[#0d1117] border-[#30363d] text-slate-300'}`}
                  >
                    <div className="text-xs font-bold">{m.name}</div>
                    <div className="text-[10px] text-slate-400">HP {m.baseHp}</div>
                  </button>
                ))}
              </div>

              <div className="md:col-span-7 bg-[#0d1117] border border-[#30363d] rounded-xl p-4 space-y-3">
                <div className="flex items-center justify-between">
                  <h3 className="text-sm font-bold text-white">{selectedMonster.name}</h3>
                  <div className="flex gap-1">
                    {['idle', 'walk', 'attack', 'hit', 'death'].map(st => (
                      <button key={st} onClick={() => setAnimState(st)} className={`px-2 py-1 rounded text-[10px] uppercase font-bold ${animState === st ? 'bg-emerald-600 text-white' : 'bg-[#161b22] text-slate-400'}`}>
                        {st}
                      </button>
                    ))}
                  </div>
                </div>
                <div className="flex justify-center bg-[#0a0e17] py-2 rounded-xl">
                  <canvas ref={previewCanvasRef} width={260} height={180} />
                </div>
                <p className="text-xs text-slate-300 bg-[#161b22] p-2.5 rounded-lg">{selectedMonster.description}</p>
                <div className="text-xs space-y-1">
                  <div className="text-amber-400 font-bold">⚡ Zayıflık: {selectedMonster.weakness}</div>
                  <div className="text-emerald-400 font-bold">✨ Düşen Eşya: {selectedMonster.dropName}</div>
                </div>
              </div>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 8. RELIC SHOP MODAL
    // ==========================================
    function RelicShop({ relics, crystals, onBuyRelic, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#161b22] border border-[#30363d] rounded-2xl w-full max-w-2xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl font-mono">
            <div className="p-4 border-b border-[#30363d] flex items-center justify-between bg-[#0d1117]">
              <div>
                <h2 className="text-base font-bold text-white">🛍️ YERALTI RELİC TÜCCARI</h2>
                <p className="text-xs text-slate-400">Kristallerle kalıcı güçlendirmeler satın al</p>
              </div>
              <div className="flex items-center gap-3">
                <div className="text-emerald-400 font-bold text-xs">💎 {crystals} CR</div>
                <button onClick={onClose} className="px-3 py-1 bg-[#21262d] rounded-lg text-slate-300">✕</button>
              </div>
            </div>
            <div className="p-4 space-y-3 overflow-y-auto">
              {relics.map(r => (
                <div key={r.id} className="p-3.5 rounded-xl border border-[#30363d] bg-[#0d1117] flex items-center justify-between">
                  <div>
                    <div className="text-sm font-bold text-white">{r.name}</div>
                    <div className="text-xs text-slate-400">{r.description}</div>
                  </div>
                  {r.purchased ? (
                    <span className="text-emerald-400 font-bold text-xs">✓ ALINDI</span>
                  ) : (
                    <button
                      disabled={crystals < r.cost}
                      onClick={() => onBuyRelic(r.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold ${crystals >= r.cost ? 'bg-emerald-600 text-white cursor-pointer' : 'bg-[#21262d] text-slate-500'}`}
                    >
                      {r.cost} 💎 AL
                    </button>
                  )}
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 9. HERO SELECT MODAL
    // ==========================================
    function HeroSelectModal({ heroes, selectedHero, onSelectHero, onClose }) {
      return (
        <div className="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
          <div className="bg-[#161b22] border border-[#30363d] rounded-2xl w-full max-w-4xl max-h-[85vh] flex flex-col overflow-hidden shadow-2xl font-mono">
            <div className="p-4 border-b border-[#30363d] flex items-center justify-between bg-[#0d1117]">
              <h2 className="text-base font-bold text-white">👤 KAHRAMAN SEÇİMİ</h2>
              <button onClick={onClose} className="px-3 py-1 bg-[#21262d] rounded-lg text-slate-300">✕</button>
            </div>
            <div className="p-6 grid grid-cols-1 md:grid-cols-3 gap-5 overflow-y-auto">
              {heroes.map(h => (
                <div
                  key={h.id}
                  onClick={() => { onSelectHero(h); }}
                  className={`p-5 rounded-2xl border cursor-pointer ${selectedHero.id === h.id ? 'bg-[#0d1117] border-emerald-500 ring-2 ring-emerald-500' : 'bg-[#0d1117] border-[#30363d]'}`}
                >
                  <img src={h.avatarUrl} alt={h.name} className="w-14 h-14 rounded-xl border-2 object-cover mb-3" style={{ borderColor: h.color }} />
                  <h3 className="text-base font-bold text-white">{h.name}</h3>
                  <div className="text-xs text-emerald-400 font-bold">{h.title}</div>
                  <p className="text-xs text-slate-300 mt-2">{h.description}</p>
                </div>
              ))}
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 10. MAIN APP ROOT COMPONENT
    // ==========================================
    function App() {
      const [currentView, setCurrentView] = useState('map');
      const [selectedHero, setSelectedHero] = useState(HEROES[0]);
      const [crystals, setCrystals] = useState(320);
      const [unlockedCount, setUnlockedCount] = useState(1);
      const [currentStageIndex, setCurrentStageIndex] = useState(0);
      const [relics, setRelics] = useState(INITIAL_RELICS);

      const [showBestiary, setShowBestiary] = useState(false);
      const [showShop, setShowShop] = useState(false);
      const [showHeroSelect, setShowHeroSelect] = useState(false);

      const attackBonus = relics.filter(r => r.purchased && r.bonusType === 'attack').reduce((s, r) => s + r.bonusValue, 0);
      const hpBonus = relics.filter(r => r.purchased && r.bonusType === 'hp').reduce((s, r) => s + r.bonusValue, 0);
      const manaBonus = relics.filter(r => r.purchased && r.bonusType === 'mana').reduce((s, r) => s + r.bonusValue, 0);
      const speedBonus = relics.filter(r => r.purchased && r.bonusType === 'speed').reduce((s, r) => s + r.bonusValue, 0);
      const critBonus = relics.filter(r => r.purchased && r.bonusType === 'crit').reduce((s, r) => s + r.bonusValue, 0);

      const handleStageComplete = (reward) => {
        setCrystals(c => c + reward);
        setUnlockedCount(p => Math.max(p, currentStageIndex + 2));
      };

      const startLevel = (idx) => {
        setCurrentStageIndex(idx);
        setCurrentView('game');
      };

      const handleNextStage = () => {
        const next = currentStageIndex + 1;
        if (next < CAVERN_LEVELS.length) {
          setCurrentStageIndex(next); setCurrentView('game');
        } else {
          setCurrentView('map');
        }
      };

      const handleBuyRelic = (relicId) => {
        const item = relics.find(r => r.id === relicId);
        if (!item || item.purchased || crystals < item.cost) return;
        setCrystals(c => c - item.cost);
        setRelics(relics.map(r => r.id === relicId ? { ...r, purchased: true } : r));
      };

      const currentLevel = CAVERN_LEVELS[currentStageIndex];
      const hasNextStage = currentStageIndex < CAVERN_LEVELS.length - 1;

      return (
        <div className="min-h-screen bg-[#0b0f19] text-[#cbd5e1] font-mono flex flex-col">
          {/* Header */}
          <header className="border-b border-[#1e293b] bg-[#0f172a] px-4 py-2.5 sticky top-0 z-40 flex flex-wrap items-center justify-between gap-3">
            <div className="flex items-center gap-3">
              <div className="w-10 h-10 rounded-xl bg-emerald-600 flex items-center justify-center font-bold text-white text-lg">⚔️</div>
              <div>
                <div className="text-sm font-bold text-white">ODESSIA: DEEP RELIC CHRONICLES</div>
                <div className="text-[11px] text-slate-400">GitHub Single File Engine (Skeleton, Goblin, Mushroom, Flying Eye)</div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <div className="px-3 py-1.5 rounded-xl bg-[#1e293b] text-emerald-400 font-bold text-xs">💎 {crystals}</div>
              <button onClick={() => setCurrentView('game')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${currentView === 'game' ? 'bg-emerald-600 text-white' : 'bg-[#1e293b] text-slate-400'}`}>Savaş</button>
              <button onClick={() => setCurrentView('map')} className={`px-3 py-1.5 rounded-xl text-xs font-bold ${currentView === 'map' ? 'bg-emerald-600 text-white' : 'bg-[#1e293b] text-slate-400'}`}>Harita</button>
              <button onClick={() => setShowBestiary(true)} className="px-3 py-1.5 rounded-xl bg-[#1e293b] text-amber-400 text-xs font-bold">📖 Kodex</button>
              <button onClick={() => setShowShop(true)} className="px-3 py-1.5 rounded-xl bg-[#1e293b] text-cyan-400 text-xs font-bold">🛍️ Tüccar</button>
              <button onClick={() => setShowHeroSelect(true)} className="px-3 py-1.5 rounded-xl bg-[#1e293b] text-purple-400 text-xs font-bold">👤 Kahraman</button>
            </div>
          </header>

          {/* Main Area */}
          <main className="p-4 max-w-6xl mx-auto w-full flex-1 space-y-4">
            {/* Status Bar */}
            <div className="bg-[#0f172a] border border-[#1e293b] rounded-2xl p-3.5 flex flex-wrap items-center justify-between gap-4">
              <div className="flex items-center gap-3">
                <img src={selectedHero.avatarUrl} alt={selectedHero.name} className="w-10 h-10 rounded-xl border-2 object-cover" style={{ borderColor: selectedHero.color }} />
                <div>
                  <div className="text-xs font-bold text-white">{selectedHero.name} ({selectedHero.title})</div>
                  <div className="text-[11px] text-slate-400">Yetenek: {selectedHero.skillName} | Ult: {selectedHero.ultimateName}</div>
                </div>
              </div>
              <div className="flex items-center gap-2 text-xs">
                <span className="px-2.5 py-1 rounded bg-[#1e293b] text-rose-400 font-bold">HP {selectedHero.hpMax + hpBonus}</span>
                <span className="px-2.5 py-1 rounded bg-[#1e293b] text-amber-400 font-bold">ATK {selectedHero.attackPower + attackBonus}</span>
                <span className="px-2.5 py-1 rounded bg-[#1e293b] text-cyan-400 font-bold">MP {selectedHero.manaMax + manaBonus}</span>
              </div>
            </div>

            {currentView === 'game' ? (
              <PlayableGameCanvas
                key={`${currentLevel.id}_${selectedHero.id}`}
                hero={selectedHero}
                stage={currentLevel}
                attackBonus={attackBonus}
                hpBonus={hpBonus}
                manaBonus={manaBonus}
                speedBonus={speedBonus}
                critBonus={critBonus}
                onStageComplete={handleStageComplete}
                onGameOver={() => {}}
                onNextStage={handleNextStage}
                hasNextStage={hasNextStage}
                onBackToMap={() => setCurrentView('map')}
              />
            ) : (
              <div className="bg-[#161b22] border border-[#30363d] rounded-2xl p-6 space-y-6">
                <h2 className="text-base font-bold text-white">MAĞARA HARİTASI (6 DERİNLİK KATMANI)</h2>
                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                  {CAVERN_LEVELS.map((lvl, idx) => {
                    const isLocked = idx >= unlockedCount;
                    return (
                      <div key={lvl.id} className={`p-4 rounded-xl border ${isLocked ? 'bg-[#0d1117]/60 opacity-50 border-[#21262d]' : 'bg-[#0d1117] border-[#30363d]'}`}>
                        <div className="flex justify-between text-xs text-emerald-400 font-bold">
                          <span>KAT {lvl.levelNum}</span>
                          <span>{lvl.threat}</span>
                        </div>
                        <h3 className="text-sm font-bold text-white my-2">{lvl.name}</h3>
                        <p className="text-xs text-slate-400 mb-3">{lvl.description}</p>
                        <div className="flex justify-between items-center pt-2 border-t border-[#21262d]">
                          <span className="text-xs text-emerald-400">+{lvl.crystalReward} 💎</span>
                          {!isLocked && (
                            <button onClick={() => startLevel(idx)} className="px-3.5 py-1.5 bg-emerald-600 rounded-lg text-white font-bold text-xs">
                              SAVAŞ ▶
                            </button>
                          )}
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {showBestiary && <BestiaryModal onClose={() => setShowBestiary(false)} />}
          {showShop && <RelicShop relics={relics} crystals={crystals} onBuyRelic={handleBuyRelic} onClose={() => setShowShop(false)} />}
          {showHeroSelect && <HeroSelectModal heroes={HEROES} selectedHero={selectedHero} onSelectHero={(h) => { setSelectedHero(h); setShowHeroSelect(false); }} onClose={() => setShowHeroSelect(false)} />}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>

</body>
</html>
