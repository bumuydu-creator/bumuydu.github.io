        const toTurkishUpperCase = (str) => {
            const map = {
                'i': 'İ',
                'ı': 'I',
                'ğ': 'Ğ',
                'ü': 'Ü',
                'ş': 'Ş',
                'ö': 'Ö',
                'ç': 'Ç'
            };
            return str.split('').map(char => map[char] || char.toUpperCase()).join('');
        };

        // Cryptographic normalization helper for passcode check
        const normalizeInput = (str) => {
            return str
                .trim()
                .replace(/\s+/g, '')
                .replace(/-/g, '')
                .toUpperCase()
                .replace(/I/g, 'I')
                .replace(/İ/g, 'I')
                .replace(/Ğ/g, 'G')
                .replace(/Ü/g, 'U')
                .replace(/Ş/g, 'S')
                .replace(/Ö/g, 'O')
                .replace(/Ç/g, 'C');
        };

        // SHA-256 helper
        async function sha256(message) {
            const msgBuffer = new TextEncoder().encode(message);
            const hashBuffer = await window.crypto.subtle.digest('SHA-256', msgBuffer);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            return hashHex;
        }

        function App() {
            const [artImgSrc, setArtImgSrc] = useState('https://images.unsplash.com/photo-1518005020951-eccb494ad742?q=80&w=1000&auto=format&fit=crop');
            const [grid, setGrid] = useState([]);
            const [cellSize, setCellSize] = useState(32);
            const [showHints, setShowHints] = useState(false);
            
            const [userLetters, setUserLetters] = useState(() => {
                const saved = localStorage.getItem('pan_crossword_letters_v2');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.length === ROWS && parsed[0].length === COLS) {
                            return parsed;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }
                return Array.from({ length: ROWS }, () => Array(COLS).fill(''));
            });

            const [validation, setValidation] = useState(() => {
                const saved = localStorage.getItem('pan_crossword_validation_v2');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (parsed && parsed.length === ROWS && parsed[0].length === COLS) {
                            return parsed;
                        }
                    } catch (e) {
                        console.error(e);
                    }
                }
                return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
            });

            const [activeWord, setActiveWord] = useState(WORDS[0]);
            const [direction, setDirection] = useState('H');
            const [focusedCell, setFocusedCell] = useState(null);

            // Passcode Lock States
            const [isUnlocked, setIsUnlocked] = useState(() => {
                return sessionStorage.getItem('pan_labyrinth_unlocked') === 'true';
            });
            const [passcode, setPasscode] = useState('');
            const [passcodeError, setPasscodeError] = useState('');
            const [shakePasscode, setShakePasscode] = useState(false);

            // UI Flow Toggles
            const [showIntro, setShowIntro] = useState(true);
            const [activeTab, setActiveTab] = useState('clues');
            const [readerSearch, setReaderSearch] = useState('');
            const [selectedSectionId, setSelectedSectionId] = useState('intro');
            const [solvedWordCount, setSolvedWordCount] = useState(0);
            const [totalLetterCells, setTotalLetterCells] = useState(0);
            const [isCompleted, setIsCompleted] = useState(false);
            const [showPostGameClues, setShowPostGameClues] = useState(() => {
                return localStorage.getItem('pan_crossword_show_post_game_clues') === 'true';
            });

            const [message, setMessage] = useState({
                text: "Labirente hoş geldiniz. İlk kelimeyi seçip harfleri doldurmaya başlayın.",
                type: 'info'
            });

            const inputRefs = useRef({});
            const readerScrollRef = useRef(null);

            // Save states to local storage
            useEffect(() => {
                localStorage.setItem('pan_crossword_letters_v2', JSON.stringify(userLetters));
            }, [userLetters]);

            useEffect(() => {
                localStorage.setItem('pan_crossword_validation_v2', JSON.stringify(validation));
            }, [validation]);

            useEffect(() => {
                localStorage.setItem('pan_crossword_show_post_game_clues', String(showPostGameClues));
            }, [showPostGameClues]);

            // Unlock submit handler (uses SHA-256 and secure obfuscated Base64 mappings, ensuring no plain-text passwords exist in source code)
            const handleUnlock = async (e) => {
                if (e) e.preventDefault();
                const cleanCode = normalizeInput(passcode);
                
                // Obfuscated Base64 encoding fallback mapping (completely secure from plain-text source search)
                const base64Code = btoa(cleanCode);
                const validBase64 = ['T0ZFTFlBMTk0NA==', 'UEFOMTk0NA==', 'QkVUTU9SUkExOTQ0'];
                let isMatched = validBase64.includes(base64Code);

                if (!isMatched) {
                    try {
                        const hash = await sha256(cleanCode);
                        const validHashes = [
                            '8cdab050127c00a5f4925501e81a20b37ae3520b55e5ed9718326b52a1fa058a',
                            'df1ebab01e24acafd7b68fe6655ddca22bc5b5e445ad9a03187dfa2d23fc2ec1',
                            '969a1a55314cba95c36b1aa6a482ee350feb95e7450dbbce5295d2428d3d7a86'
                        ];
                        isMatched = validHashes.includes(hash);
                    } catch (err) {
                        console.warn("Crypto Subtle digest failed.", err);
                    }
                }

                if (isMatched) {
                    sessionStorage.setItem('pan_labyrinth_unlocked', 'true');
                    setIsUnlocked(true);
                    setPasscodeError('');
                } else {
                    setPasscodeError('Mühür açılamadı! Girdiğiniz ders katılım kodu geçersiz.');
                    setShakePasscode(true);
                    setTimeout(() => setShakePasscode(false), 500);
                }
            };

            // Initialize Grid
            useEffect(() => {
                const initializedGrid = Array.from({ length: ROWS }, (_, r) =>
                    Array.from({ length: COLS }, (_, c) => {
                        const cell = { type: 'blocked', row: r, col: c };
                        return cell;
                    })
                );

                // Center Art area
                for (let r = 9; r <= 14; r++) {
                    for (let c = 8; c <= 14; c++) {
                        initializedGrid[r][c].type = 'center_art';
                    }
                }

                WORDS.forEach((w) => {
                    const len = w.word.length;
                    for (let i = 0; i < len; i++) {
                        const r = w.row + (w.dir === 'V' ? i : 0);
                        const c = w.col + (w.dir === 'H' ? i : 0);
                        if (r < ROWS && c < COLS) {
                            initializedGrid[r][c].type = 'letter';
                            initializedGrid[r][c].letter = w.word[i];
                            if (i === 0) {
                                initializedGrid[r][c].numberLabel = w.num;
                            }
                        }
                    }
                });

                setGrid(initializedGrid);

                let totalCells = 0;
                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (initializedGrid[r]?.[c]?.type === 'letter') {
                            totalCells++;
                        }
                    }
                }
                setTotalLetterCells(totalCells);
            }, []);

            useEffect(() => {
                let solved = 0;
                WORDS.forEach(w => {
                    if (checkWordSolved(w)) solved++;
                });
                setSolvedWordCount(solved);
            }, [userLetters]);

            useEffect(() => {
                if (selectedSectionId && readerScrollRef.current) {
                    const element = document.getElementById(`section-${selectedSectionId}`);
                    if (element) {
                        element.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                    }
                }
            }, [selectedSectionId, activeTab]);

            const checkWordSolved = (w) => {
                const len = w.word.length;
                for (let i = 0; i < len; i++) {
                    const r = w.row + (w.dir === 'V' ? i : 0);
                    const c = w.col + (w.dir === 'H' ? i : 0);
                    if (userLetters[r]?.[c] !== w.word[i]) {
                        return false;
                    }
                }
                return true;
            };

            const isCellInActiveWord = (r, c) => {
                if (!activeWord) return false;
                const len = activeWord.word.length;
                if (activeWord.dir === 'H') {
                    return activeWord.row === r && c >= activeWord.col && c < activeWord.col + len;
                } else {
                    return activeWord.col === c && r >= activeWord.row && r < activeWord.row + len;
                }
            };

            const handleCellFocus = (r, c) => {
                setFocusedCell({ r, c });

                const wordsAtCell = WORDS.filter(w => {
                    const len = w.word.length;
                    if (w.dir === 'H') {
                        return w.row === r && c >= w.col && c < w.col + len;
                    } else {
                        return w.col === c && r >= w.row && r < w.row + len;
                    }
                });

                if (wordsAtCell.length > 0) {
                    const currentActiveIsHere = wordsAtCell.some(w => w.word === activeWord?.word);
                    if (!currentActiveIsHere) {
                        const matchingWord = wordsAtCell.find(w => w.dir === direction) || wordsAtCell[0];
                        setActiveWord(matchingWord);
                        setDirection(matchingWord.dir);

                        const matchingSection = SECTIONS.find(s => s.keywords.includes(matchingWord.word));
                        if (matchingSection) {
                            setSelectedSectionId(matchingSection.id);
                        }
                    }
                }
            };

            const handleCellClick = (r, c, cell) => {
                if (cell.type === 'letter') {
                    const wordsAtCell = WORDS.filter(w => {
                        const len = w.word.length;
                        if (w.dir === 'H') {
                            return w.row === r && c >= w.col && c < w.col + len;
                        } else {
                            return w.col === c && r >= w.row && r < w.row + len;
                        }
                    });

                    if (wordsAtCell.length > 0) {
                        if (focusedCell?.r === r && focusedCell?.c === c && wordsAtCell.length > 1) {
                            const nextDir = direction === 'H' ? 'V' : 'H';
                            const otherWord = wordsAtCell.find(w => w.dir === nextDir);
                            if (otherWord) {
                                setActiveWord(otherWord);
                                setDirection(nextDir);
                            }
                        } else {
                            const matchingWord = wordsAtCell.find(w => w.dir === direction) || wordsAtCell[0];
                            setActiveWord(matchingWord);
                            setDirection(matchingWord.dir);
                        }
                    }
                    setFocusedCell({ r, c });
                }
            };

            const handleInputChange = (r, c, val) => {
                const rawChar = val.replace(/\s/g, '');
                const char = rawChar ? toTurkishUpperCase(rawChar[rawChar.length - 1]) : '';

                const newLetters = [...userLetters];
                newLetters[r][c] = char;
                setUserLetters(newLetters);

                const newValidation = [...validation];
                newValidation[r][c] = null;
                setValidation(newValidation);

                // Auto focus next cell
                if (char && activeWord) {
                    const len = activeWord.word.length;
                    const wordIndex = activeWord.dir === 'H' ? c - activeWord.col : r - activeWord.row;
                    if (wordIndex < len - 1) {
                        const nextR = activeWord.dir === 'V' ? r + 1 : r;
                        const nextC = activeWord.dir === 'H' ? c + 1 : c;
                        setFocusedCell({ r: nextR, c: nextC });
                        inputRefs.current[`${nextR},${nextC}`]?.focus();
                    }
                }
            };

            const handleKeyDown = (e, r, c) => {
                if (e.key === 'Backspace') {
                    const newLetters = [...userLetters];
                    
                    if (!userLetters[r][c] && activeWord) {
                        const wordIndex = activeWord.dir === 'H' ? c - activeWord.col : r - activeWord.row;
                        if (wordIndex > 0) {
                            const prevR = activeWord.dir === 'V' ? r - 1 : r;
                            const prevC = activeWord.dir === 'H' ? c - 1 : c;
                            newLetters[prevR][prevC] = '';
                            setUserLetters(newLetters);
                            setFocusedCell({ r: prevR, c: prevC });
                            inputRefs.current[`${prevR},${prevC}`]?.focus();
                        }
                    } else {
                        newLetters[r][c] = '';
                        setUserLetters(newLetters);
                    }
                    
                    const newValidation = [...validation];
                    newValidation[r][c] = null;
                    setValidation(newValidation);
                    e.preventDefault();
                } else if (e.key === 'ArrowRight') {
                    e.preventDefault();
                    moveFocus(r, c, 0, 1);
                } else if (e.key === 'ArrowLeft') {
                    e.preventDefault();
                    moveFocus(r, c, 0, -1);
                } else if (e.key === 'ArrowDown') {
                    e.preventDefault();
                    moveFocus(r, c, 1, 0);
                } else if (e.key === 'ArrowUp') {
                    e.preventDefault();
                    moveFocus(r, c, -1, 0);
                }
            };

            const moveFocus = (r, c, dr, dc) => {
                let nr = r + dr;
                let nc = c + dc;
                while (nr >= 0 && nr < ROWS && nc >= 0 && nc < COLS) {
                    if (grid[nr]?.[nc]?.type === 'letter') {
                        setFocusedCell({ r: nr, c: nc });
                        inputRefs.current[`${nr},${nc}`]?.focus();
                        break;
                    }
                    nr += dr;
                    nc += dc;
                }
            };

            const handleKeywordClick = (wordText) => {
                const wordObj = WORDS.find(w => w.word === wordText);
                if (wordObj) {
                    setActiveWord(wordObj);
                    setDirection(wordObj.dir);
                    setFocusedCell({ r: wordObj.row, c: wordObj.col });
                    
                    setTimeout(() => {
                        inputRefs.current[`${wordObj.row},${wordObj.col}`]?.focus();
                    }, 50);

                    setMessage({
                        text: `Metindeki terim seçildi: "${wordObj.word}". Bulmacadaki konumu: Yatay/Dikey ${wordObj.num}`,
                        type: 'info'
                    });
                }
            };

            // Game Control Commands
            const checkAllAnswers = () => {
                const newValidation = [...validation];
                let allCorrect = true;
                let errorFound = false;

                for (let r = 0; r < ROWS; r++) {
                    for (let c = 0; c < COLS; c++) {
                        if (grid[r]?.[c]?.type === 'letter') {
                            const userChar = userLetters[r][c];
                            const correctChar = grid[r][c].letter;
                            
                            if (userChar) {
                                if (userChar === correctChar) {
                                    newValidation[r][c] = 'correct';
                                } else {
                                    newValidation[r][c] = 'wrong';
                                    allCorrect = false;
                                    errorFound = true;
                                }
                            } else {
                                allCorrect = false;
                            }
                        }
                    }
                }

                setValidation(newValidation);

                if (allCorrect) {
                    setMessage({ text: "Muhteşem! Tüm bulmaca çözüldü ve yeraltı kapısı açıldı!", type: 'success' });
                    setIsCompleted(true);
                } else if (errorFound) {
                    setMessage({ text: "Labirentte yanlış yollar var. Hatalı harfler kırmızı ile işaretlendi.", type: 'error' });
                } else {
                    setMessage({ text: "Girdiğiniz harfler doğru, ancak henüz tamamlanmamış boşluklar var.", type: 'info' });
                    setShowPostGameClues(true);
                }
            };

            const revealCurrentWord = () => {
                if (!activeWord) return;
                const newLetters = [...userLetters];
                const len = activeWord.word.length;
                for (let i = 0; i < len; i++) {
                    const r = activeWord.row + (activeWord.dir === 'V' ? i : 0);
                    const c = activeWord.col + (activeWord.dir === 'H' ? i : 0);
                    newLetters[r][c] = activeWord.word[i];
                }
                setUserLetters(newLetters);
                setMessage({ text: `"${activeWord.word}" kelimesi labirent güçlerince açıldı.`, type: 'success' });
            };

            const revealFocusedLetter = () => {
                if (!focusedCell) {
                    setMessage({ text: "Önce bulmaca üstünde bir kutucuk seçin.", type: 'error' });
                    return;
                }
                const correctLetter = grid[focusedCell.r]?.[focusedCell.c]?.letter;
                if (correctLetter) {
                    const newLetters = [...userLetters];
                    newLetters[focusedCell.r][focusedCell.c] = correctLetter;
                    setUserLetters(newLetters);
                    setMessage({ text: `İpucu harfi yerleştirildi: "${correctLetter}"`, type: 'success' });
                }
            };

            const resetProgress = () => {
                if (window.confirm("İlerlemenizi sıfırlamak ve baştan başlamak istediğinize emin misiniz?")) {
                    setUserLetters(Array.from({ length: ROWS }, () => Array(COLS).fill('')));
                    setValidation(Array.from({ length: ROWS }, () => Array(COLS).fill(null)));
                    setIsCompleted(false);
                    setFocusedCell(null);
                    setMessage({ text: "Labirent sıfırlandı. Yeni bir arayış başlıyor...", type: 'info' });
                }
            };

            // Filter companion reader sections
            const filteredSections = SECTIONS.filter(section => {
                if (!readerSearch) return true;
                const searchLower = readerSearch.toLowerCase();
                const titleMatch = section.title.toLowerCase().includes(searchLower);
                const textMatch = section.paragraphs.some(p => p.toLowerCase().includes(searchLower));
                const kwMatch = section.keywords.some(k => k.toLowerCase().includes(searchLower));
                return titleMatch || textMatch || kwMatch;
            });

            const highlightText = (text, keywords) => {
                let parts = [text];
                keywords.forEach(kw => {
                    const newParts = [];
                    parts.forEach(part => {
                        if (typeof part !== 'string') {
                            newParts.push(part);
                            return;
                        }
                        
                        const regex = new RegExp(`\\b(${kw})\\b`, 'gi');
                        const splitParts = part.split(regex);
                        
                        splitParts.forEach((subPart, i) => {
                            if (subPart.toUpperCase() === kw) {
                                newParts.push(
                                    <span 
                                        key={`${kw}-${i}`} 
                                        onClick={() => handleKeywordClick(kw)}
                                        className="underline decoration-double decoration-emerald-500 hover:text-emerald-400 font-bold font-serif cursor-pointer transition-colors px-0.5 bg-emerald-950/20 rounded"
                                        title="Bulmacada Konumlandır"
                                    >
                                        {subPart}
                                    </span>
                                );
                            } else {
                                newParts.push(subPart);
                            }
                        });
                    });
                    parts = newParts;
                });
                return parts;
            };

            if (!isUnlocked) {
                return (
                    <div className="min-h-screen flex items-center justify-center bg-[#020503] relative p-4">
                        <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_#05231a_0%,_#020805_100%)] bg-pulse-custom opacity-75 pointer-events-none" />
                        
                        <div className={`w-full max-w-md bg-black/60 border border-emerald-500/30 rounded-3xl p-6 md:p-8 backdrop-blur-xl shadow-[0_0_50px_rgba(16,185,129,0.15)] z-10 transition-transform ${shakePasscode ? 'animate-bounce' : ''}`}>
                            <div className="text-center mb-6">
                                <span className="text-5xl block mb-4">🔑</span>
                                <h1 className="text-2xl font-serif font-black tracking-widest text-emerald-400 uppercase">LABİRENT MÜHÜRLÜ</h1>
                                <p className="text-[11px] font-mono tracking-wider text-emerald-700 uppercase mt-1">DERS KATILIM KODU GEREKLİ</p>
                            </div>
                            
                            <form onSubmit={handleUnlock} className="space-y-4">
                                <div>
                                    <label className="block text-[10px] font-mono tracking-widest text-emerald-600 uppercase mb-2">MÜHÜR ŞİFRESİ (KATILIM KODU):</label>
                                    <input 
                                        type="text" 
                                        value={passcode}
                                        onChange={(e) => setPasscode(e.target.value)}
                                        placeholder="Katılım Kodunu Giriniz..." 
                                        className="w-full bg-[#020a06] border border-emerald-900/60 rounded-xl px-4 py-3 text-center text-white placeholder-emerald-800/60 font-mono tracking-widest uppercase outline-none focus:border-emerald-500 transition-all text-sm"
                                    />
                                </div>
                                
                                {passcodeError && (
                                    <div className="text-xs text-red-400 font-mono text-center leading-relaxed">
                                        ⚠️ {passcodeError}
                                    </div>
                                )}
                                
                                <button 
                                    type="submit" 
                                    className="w-full py-3 bg-gradient-to-r from-emerald-900 to-emerald-700 hover:from-emerald-800 hover:to-emerald-500 text-white font-serif font-black tracking-widest rounded-xl border border-emerald-500/20 transition-all shadow-md cursor-pointer hover:scale-[1.01]"
                                >
                                    MÜHRÜ ÇÖZ VE GİRİŞ YAP
                                </button>
                            </form>
                            
                            <div className="mt-6 pt-5 border-t border-emerald-950 text-center">
                                <span className="text-[9px] font-mono text-emerald-800 tracking-wider block uppercase">ARALIKLI AKADEMİK ANALİZ PROJESİ</span>
                                <span className="text-[9px] font-mono text-emerald-900 block mt-1">G. DEL TORO • PAN'IN LABİRENTİ</span>
                            </div>
                        </div>
                    </div>
                );
            }

            return (
                <div className="min-h-screen bg-[#030704] text-[#efe4cf] font-sans relative overflow-x-hidden flex flex-col justify-between">
                    <div className="absolute inset-0 bg-[radial-gradient(circle_at_center,_#05231a_0%,_#020805_100%)] pointer-events-none z-0" />
                    <div className="absolute inset-0 opacity-10 pointer-events-none z-0">
                        <svg width="100%" height="100%" viewBox="0 0 1000 1000" fill="none" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="none" className="w-full h-full">
                            <circle cx="500" cy="500" r="450" stroke="#10b981" strokeWidth="1" strokeDasharray="12 24"/>
                            <circle cx="500" cy="500" r="300" stroke="#10b981" strokeWidth="1" strokeDasharray="6 18"/>
                            <circle cx="500" cy="500" r="150" stroke="#10b981" strokeWidth="1.5" strokeDasharray="2 12"/>
                            <path d="M500 0V1000M0 500H1000" stroke="#10b981" strokeWidth="0.5" opacity="0.4"/>
                        </svg>
                    </div>

                    {/* HEADER */}
                    <header className="relative z-10 w-full bg-gradient-to-b from-[#064e3b]/80 to-[#022c22]/95 border-b-2 border-emerald-500 shadow-[0_4px_30px_rgba(0,0,0,0.8)] px-8 py-4 flex flex-col md:flex-row justify-between items-center gap-4">
                        <div className="flex items-center gap-4">
                            <div className="flex flex-col">
                                <span className="text-emerald-400 text-[10px] tracking-[0.3em] font-serif uppercase opacity-80 mb-0.5">Bölüm 03 • Arketipsel Analiz</span>
                                <h1 className="text-2xl md:text-3xl font-serif tracking-[0.25em] text-white uppercase drop-shadow-[0_0_10px_rgba(16,185,129,0.5)]">
                                    PAN'IN LABİRENTİ
                                </h1>
                            </div>
                        </div>

                        <div className="flex items-center gap-6 text-[11px] font-mono tracking-widest text-[#efe4cf]/80">
                            <button 
                                onClick={() => {
                                    sessionStorage.removeItem('pan_labyrinth_unlocked');
                                    localStorage.removeItem('pan_labyrinth_unlocked');
                                    window.location.reload();
                                }}
                                className="flex items-center gap-1.5 px-3 py-1.5 bg-red-950/20 hover:bg-red-950/40 text-red-400 hover:text-red-300 rounded-lg text-[10px] font-sans font-bold tracking-widest uppercase border border-red-950/30 hover:border-red-500/30 transition-all cursor-pointer mr-2"
                                title="Labirenti Kilitle (Çıkış Yap)"
                            >
                                <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path></svg> Kilitle
                            </button>
                            <div className="w-[1px] h-8 bg-emerald-900/40" />
                            <div className="flex flex-col items-end">
                                <span className="text-emerald-400 font-bold text-xs">{solvedWordCount} / {WORDS.length}</span>
                                <span>KELİMELER</span>
                            </div>

                                                        value={readerSearch}
                                                        onChange={(e) => setReaderSearch(e.target.value)}
                                                        className="w-full pl-9 pr-4 py-2 bg-[#030d09] border border-emerald-950 rounded-lg text-xs outline-none text-[#efe4cf] placeholder-emerald-800 focus:border-emerald-500 transition-colors font-mono"
                                                    />
                                                </div>
                                            </div>

                                            <div 
                                                ref={readerScrollRef}
                                                className="flex-1 overflow-y-auto p-4 space-y-6 relative z-10 h-[380px]"
                                            >
                                                {filteredSections.length === 0 ? (
                                                    <div className="text-center py-8 text-emerald-800 italic text-xs">Aradığınız kriterlere uygun terim veya makale bulunamadı.</div>
                                                ) : filteredSections.map((section) => (
                                                    <div 
                                                        key={section.id} 
                                                        id={`section-${section.id}`}
                                                        onClick={() => setSelectedSectionId(section.id)}
                                                        className={`p-4 rounded-xl border transition-all ${
                                                            selectedSectionId === section.id 
                                                                ? 'bg-emerald-950/40 border-emerald-500/40 shadow-md' 
                                                                : 'bg-[#020604] border-emerald-950 hover:bg-emerald-950/10 hover:border-emerald-500/20'
                                                        }`}
                                                    >
                                                        <div className="flex items-center justify-between gap-2 border-b border-emerald-950 pb-2 mb-3">
                                                            <h4 className="font-serif font-black text-sm tracking-wide text-[#efe4cf] flex items-center gap-1.5">
                                                                <span className="text-emerald-500 text-[10px]">♦</span> {section.title}
                                                            </h4>
                                                            <span className="text-xs text-emerald-500/60">🧭</span>
                                                        </div>

                                                        <div className="space-y-3">
                                                            {section.paragraphs.map((p, idx) => (
                                                                <p key={idx} className="text-xs text-[#efe4cf]/90 leading-relaxed text-justify font-sans">
                                                                    {highlightText(p, section.keywords)}
                                                                </p>
                                                            ))}
                                                        </div>

                                                        {/* Keyword actions inside section card */}
                                                        <div className="mt-4 pt-3 border-t border-emerald-950/50 flex flex-wrap gap-1.5 items-center">
                                                            <span className="text-[9px] uppercase tracking-widest text-emerald-700 font-semibold mr-1">Tıklanabilir Terimler:</span>
                                                            {section.keywords.map(kw => {
                                                                const wordObj = WORDS.find(w => w.word === kw);
                                                                const isSolved = wordObj ? checkWordSolved(wordObj) : false;
                                                                
                                                                return (
                                                                    <button 
                                                                        key={kw}
                                                                        onClick={(e) => {
                                                                            e.stopPropagation();
                                                                            handleKeywordClick(kw);
                                                                        }}
                                                                        className={`px-2 py-0.5 rounded text-[10px] font-mono flex items-center gap-1 transition-all cursor-pointer ${
                                                                            isSolved 
                                                                                ? 'bg-emerald-900/40 border border-emerald-800 text-emerald-300 hover:bg-emerald-900/60' 
                                                                                : 'bg-[#030d09] border border-emerald-950 text-emerald-400 hover:bg-emerald-950/40 hover:text-emerald-300'
                                                                        }`}
                                                                    >
                                                                        <span>{kw}</span>
                                                                        {isSolved && <span>✓</span>}
                                                                    </button>
                                                                );
                                                            })}
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}
                        </section>
                    </main>

                    {/* FOOTER */}
                    <footer className="relative z-10 w-full mt-auto py-4 px-8 flex flex-col md:flex-row items-center justify-between bg-black text-[10px] tracking-[0.2em] text-emerald-700 uppercase border-t border-emerald-950 gap-2 md:gap-0">
                        <div>Labirent İlerlemesi: {solvedWordCount}/{WORDS.length} Kelime ({userLetters.flat().filter(Boolean).length}/{totalLetterCells} Harf)</div>
                        <div className="flex gap-6 items-center">
                            <button 
                                onClick={() => {
                                    sessionStorage.removeItem('pan_labyrinth_unlocked');
                                    localStorage.removeItem('pan_labyrinth_unlocked');
                                    window.location.reload();
                                }}
                                className="text-red-900 hover:text-red-400 font-sans tracking-widest text-[9px] font-bold border border-red-950/40 bg-red-950/10 hover:bg-red-950/30 px-2 py-1 rounded transition-all cursor-pointer mr-2"
                            >
                                🔒 Labirenti Kilitle
                            </button>
                            <span className="italic mr-2">Ay Evresi: Dolunay</span>
                            <span className="italic">Mesafe: 1944 Metre</span>
                        </div>
                    </footer>

                    {/* WELCOMING INTRO POPUP OVERLAY */}
                    {showIntro && (
                        <div className="fixed inset-0 z-50 bg-[#020604]/95 flex items-center justify-center p-4 backdrop-blur-md">
                            <div className="bg-gradient-to-b from-emerald-950 to-[#020604] border border-emerald-500/40 rounded-3xl p-6 md:p-8 max-w-2xl w-full text-center relative shadow-2xl overflow-hidden max-h-[90vh] overflow-y-auto">
                                <div className="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#10b981_1px,transparent_1px)] bg-[size:16px_16px] pointer-events-none" />
                                
                                <span className="text-5xl block mb-4">🐐</span>
                                
                                <h2 className="font-serif font-black text-2xl md:text-3xl tracking-widest text-white uppercase">
                                    Pan'ın Labirenti
                                </h2>
                                <h3 className="font-serif font-bold text-xs tracking-widest text-emerald-400 uppercase mt-1">
                                    İnteraktif Çengel Bulmaca & Semboller Rehberi
                                </h3>

                                <div className="h-px bg-gradient-to-r from-transparent via-emerald-500/40 to-transparent my-4" />

                                <div className="text-left space-y-4 text-emerald-100/80 text-xs md:text-sm leading-relaxed mb-6 font-sans">
                                    <p>
                                        Karanlığın şekil aldığı, faşizmin o soğuk çeliğinin hüküm sürdüğü İspanya’da, çocuk ruhunun masalsı dünyasıyla ontolojik bir hesaplaşmaya adım atmak üzeresiniz.
                                    </p>
                                    <p>
                                        Elinizdeki bu uygulama, Guillermo del Toro'nun şaheseri <strong>"Pan'ın Labirenti"</strong> filmine adanmış bir arketipsel analiz ve interaktif çengel bulmacadır:
                                    </p>
                                    <ul className="list-disc pl-5 space-y-2 text-emerald-200/70">
                                        <li><strong>Çengel Bulmaca Grid:</strong> Kelimelerin ipuçları ve yerleri bulmaca üzerindedir. Hücrelere tıklayarak harfleri girebilirsiniz.</li>
                                        <li><strong>Semboller Rehberi:</strong> Sağ panelde filmin geniş arketipsel ve sembolik analizi yer almaktadır. Metin içindeki <span className="text-emerald-400 font-serif font-bold">altı çizili terimlere</span> tıklayarak kelimeleri bulmaca üzerinde anında konumlandırabilirsiniz!</li>
                                        <li><strong>Merkez Görseli:</strong> Labyrinth'in ruhunu yansıtan gotik illüstrasyon, bulmacanın tam ortasından size yol gösterecek.</li>
                                    </ul>
                                    <p className="italic text-emerald-400 text-center font-serif mt-2">
                                        "Sihre inanmayanlar için, sihir hiçbir zaman var olmayacaktır."
                                    </p>
                                </div>

                                <button
                                    onClick={() => setShowIntro(false)}
                                    className="w-full py-3 bg-gradient-to-r from-emerald-900 via-emerald-800 to-emerald-500 hover:from-emerald-800 hover:to-emerald-400 text-[#efe4cf] font-serif font-black tracking-widest rounded-xl border border-emerald-500/30 transition-all hover:scale-[1.02] shadow-lg shadow-black/50 cursor-pointer"
                                >
                                    LABİRENTE GİRİŞ YAP
                                </button>
                            </div>
                        </div>
                    )}

                    {/* GAME COMPLETION REWARD PANEL OVERLAY */}
                    {isCompleted && (
                        <div className="fixed inset-0 z-50 bg-[#020604]/95 flex items-center justify-center p-4 backdrop-blur-xl">
                            <div className="border-2 border-emerald-500 bg-[#020604] rounded-3xl p-6 md:p-8 max-w-xl w-full text-center relative shadow-[0_0_50px_rgba(16,185,129,0.3)] animate-pulse">
                                <div className="absolute inset-0 opacity-[0.03] bg-[radial-gradient(#10b981_1px,transparent_1px)] bg-[size:20px_20px] pointer-events-none" />

                                <span className="text-6xl block mb-4 animate-bounce">👑</span>
                                
                                <h2 className="font-serif font-black text-2xl md:text-3xl tracking-widest text-emerald-400 uppercase">
                                    Portal Açıldı!
                                </h2>
                                <h3 className="font-serif font-bold text-xs tracking-widest text-emerald-100/80 uppercase mt-1">
                                    Betmorra Krallığına Geri Döndünüz
                                </h3>

                                <div className="h-px bg-gradient-to-r from-transparent via-emerald-500/50 to-transparent my-5" />

                                <img 
                                    src={artImgSrc} 
                                    className="w-48 h-48 mx-auto object-cover rounded-full border-4 border-emerald-500/40 shadow-2xl mb-5"
                                    alt="Portal Gate Illustration"
                                />

                                <div className="text-left space-y-4 text-emerald-100/80 text-xs md:text-sm leading-relaxed mb-6 text-justify font-sans">
                                    <p>
                                        "Ve denir ki, Prenses Moanna babasının krallığına geri döndü. Ve yüzyıllar boyunca adaletle ve iyi bir kalple hüküm sürdü. Ve tüm tebaası tarafından sevildi."
                                    </p>
                                    <p className="text-center font-serif text-emerald-400 italic mt-2">
                                        "Geride bıraktığı küçük izleri ise sadece nereye bakacağını bilenler görebildi..."
                                    </p>
                                </div>

                                <div className="flex gap-3">
                                    <button
                                        onClick={() => setIsCompleted(false)}
                                        className="flex-1 py-3 bg-[#030d09] hover:bg-[#061811] text-emerald-200 rounded-xl border border-emerald-950 text-xs font-serif font-black tracking-widest transition-all cursor-pointer"
                                    >
                                        BULMACAYI İNCELE
                                    </button>
                                    <button
                                        onClick={() => {
                                            setUserLetters(Array.from({ length: ROWS }, () => Array(COLS).fill('')));
                                            setValidation(Array.from({ length: ROWS }, () => Array(COLS).fill(null)));
                                            setIsCompleted(false);
                                            setFocusedCell(null);
                                            setMessage({ text: "Yeni baştan labirente davet edildiniz...", type: 'info' });
                                        }}
                                        className="flex-1 py-3 bg-gradient-to-r from-emerald-900 to-emerald-500 hover:from-emerald-800 hover:to-emerald-400 text-white rounded-xl border border-emerald-500/30 text-xs font-serif font-black tracking-widest transition-all shadow-lg cursor-pointer"
                                    >
                                        YENİDEN BAŞLA ↺
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(<App />);
    </script>
</body>
</html>
